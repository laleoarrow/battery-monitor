name: Sync stable release to Homebrew tap

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable Wattson release tag
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  sync:
    name: Update laleoarrow/homebrew-tap
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check out the Homebrew tap with push credentials
        if: env.TAP_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: laleoarrow/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          fetch-depth: 0

      - name: Check out the public Homebrew tap for validation only
        if: env.TAP_TOKEN == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: laleoarrow/homebrew-tap
          ref: main
          path: homebrew-tap
          persist-credentials: false
          fetch-depth: 0

      - name: Update and push the Wattson cask
        id: sync-cask
        shell: bash
        working-directory: homebrew-tap
        run: |
          set -euo pipefail

          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          readonly VERSION="${RELEASE_TAG#v}"
          readonly PKG_NAME="Wattson-v${VERSION}-macos-universal.pkg"
          readonly DMG_NAME="Wattson-v${VERSION}-macos-universal.dmg"
          readonly INFO_NAME="Wattson-v${VERSION}-release-info.txt"
          readonly CHECKSUM_NAME="SHA256SUMS.txt"
          readonly ASSET_BASE="https://github.com/laleoarrow/battery-monitor/releases/download/${RELEASE_TAG}"
          readonly DOWNLOAD_DIR="$RUNNER_TEMP/wattson-release"
          readonly RELEASE_JSON="$RUNNER_TEMP/wattson-release.json"

          assert_metadata_line() {
            local expected="$1"
            [[ "$(/usr/bin/awk -v expected="$expected" \
              '$0 == expected { count++ } END { print count + 0 }' \
              "$DOWNLOAD_DIR/$INFO_NAME")" == "1" ]]
          }

          assert_metadata_key_once() {
            local expected_key="$1"
            [[ "$(/usr/bin/awk -F= -v expected_key="$expected_key" \
              '$1 == expected_key { count++ } END { print count + 0 }' \
              "$DOWNLOAD_DIR/$INFO_NAME")" == "1" ]]
          }

          gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RELEASE_JSON"
          [[ "$(/usr/bin/jq -r .tag_name "$RELEASE_JSON")" == "$RELEASE_TAG" ]]
          [[ "$(/usr/bin/jq -r .draft "$RELEASE_JSON")" == "false" ]]
          [[ "$(/usr/bin/jq -r .prerelease "$RELEASE_JSON")" == "false" ]]

          /bin/mkdir -p "$DOWNLOAD_DIR"
          for asset_name in "$PKG_NAME" "$DMG_NAME" "$INFO_NAME" "$CHECKSUM_NAME"; do
            /usr/bin/jq -e \
              --arg name "$asset_name" \
              '[.assets[] | select(.name == $name)] | length == 1' \
              "$RELEASE_JSON" >/dev/null
            /usr/bin/curl \
              --fail \
              --location \
              --proto '=https' \
              --retry 3 \
              --retry-delay 2 \
              --tlsv1.2 \
              --output "$DOWNLOAD_DIR/$asset_name" \
              "$ASSET_BASE/$asset_name"
          done

          [[ "$(/usr/bin/wc -l < "$DOWNLOAD_DIR/$CHECKSUM_NAME" | /usr/bin/tr -d ' ')" == "3" ]]
          (
            cd "$DOWNLOAD_DIR"
            /usr/bin/sha256sum -c "$CHECKSUM_NAME"
          )
          assert_metadata_line "version=$VERSION"
          assert_metadata_line "architectures=arm64,x86_64"
          assert_metadata_line "minimum_macos=12.0"
          assert_metadata_line "install_path=/Applications/Wattson.app"
          for metadata_key in \
            distribution_mode \
            app_signature \
            helper_signature \
            package_signature \
            dmg_signature \
            notarized \
            stapled; do
            assert_metadata_key_once "$metadata_key"
          done
          RELEASE_DISTRIBUTION_MODE="$(
            /usr/bin/awk -F= \
              '$1 == "distribution_mode" { count++; value = $2 } \
               END { if (count == 1) print value }' \
              "$DOWNLOAD_DIR/$INFO_NAME"
          )"
          readonly RELEASE_DISTRIBUTION_MODE
          case "$RELEASE_DISTRIBUTION_MODE" in
            community-ad-hoc)
              assert_metadata_line "app_signature=ad-hoc"
              assert_metadata_line "helper_signature=ad-hoc"
              assert_metadata_line "package_signature=unsigned"
              assert_metadata_line "dmg_signature=unsigned"
              assert_metadata_line "notarized=no"
              assert_metadata_line "stapled=no"
              ;;
            developer-id)
              assert_metadata_line "app_signature=developer-id"
              assert_metadata_line "helper_signature=developer-id"
              assert_metadata_line "package_signature=developer-id"
              assert_metadata_line "dmg_signature=developer-id"
              assert_metadata_line "notarized=yes"
              assert_metadata_line "stapled=yes"
              ;;
            *)
              echo "unsupported release distribution metadata: $RELEASE_DISTRIBUTION_MODE" >&2
              exit 1
              ;;
          esac

          SHA256="$(
            /usr/bin/awk -v name="$PKG_NAME" '$2 == name { print $1 }' \
              "$DOWNLOAD_DIR/$CHECKSUM_NAME"
          )"
          readonly SHA256
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]]

          /bin/mkdir -p Casks
          [[ ! -L Casks && ! -L Casks/wattson.rb ]]
          cat > Casks/wattson.rb <<EOF
          cask "wattson" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/laleoarrow/battery-monitor/releases/download/v#{version}/Wattson-v#{version}-macos-universal.pkg"
            name "Wattson"
            desc "Real-time menu-bar power-flow monitor"
            homepage "https://github.com/laleoarrow/battery-monitor"

            depends_on macos: :monterey

            pkg "Wattson-v#{version}-macos-universal.pkg"

            uninstall launchctl: [
                        "com.leoarrow.wattson.helper",
                        "com.leoarrow.wattson.login",
                      ],
                      quit:      "com.leoarrow.wattson",
                      pkgutil:   "com.leoarrow.wattson.pkg",
                      delete:    [
                        "/Applications/Wattson.app",
                        "/Library/LaunchDaemons/com.leoarrow.wattson.helper.plist",
                        "/Library/PrivilegedHelperTools/com.leoarrow.wattson.helper",
                        "/var/run/wattson-helper.sock",
                        "~/Library/LaunchAgents/com.leoarrow.wattson.login.plist",
                      ]

            zap trash: [
              "~/Library/Application Support/Wattson",
              "~/Library/Caches/com.leoarrow.wattson",
              "~/Library/Containers/com.leoarrow.wattson",
              "~/Library/Preferences/com.leoarrow.wattson.plist",
              "~/Library/Saved Application State/com.leoarrow.wattson.savedState",
            ]
          end
          EOF

          ruby -c Casks/wattson.rb
          git diff --check
          if [[ -z "$(git status --porcelain -- Casks/wattson.rb)" ]]; then
            echo "The Wattson cask already matches v$VERSION."
            echo "tap_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$TAP_TOKEN" ]]; then
            echo "The exact v$VERSION cask was generated and validated, but cross-repository push credentials are not configured." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "Sync Casks/wattson.rb from a trusted maintainer checkout, then require the tap CI run to pass." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/wattson.rb
          git commit -m "Update Wattson to v$VERSION"
          git push origin HEAD:main
          echo "tap_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require the exact Homebrew tap commit to pass brew test-bot
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_SHA: ${{ steps.sync-cask.outputs.tap_sha }}
        run: |
          set -euo pipefail
          [[ "$TAP_SHA" =~ ^[0-9a-f]{40}$ ]]
          readonly TAP_RUNS="$RUNNER_TEMP/wattson-tap-runs.json"
          passed=0
          for attempt in {1..60}; do
            gh api \
              --method GET \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/laleoarrow/homebrew-tap/actions/workflows/tests.yml/runs" \
              -f event=push \
              -f head_sha="$TAP_SHA" \
              -f per_page=10 \
              > "$TAP_RUNS"
            TAP_STATE="$(
              /usr/bin/jq -r --arg sha "$TAP_SHA" '
                [
                  .workflow_runs[]
                  | select(.head_sha == $sha and .head_branch == "main" and .event == "push")
                ]
                | sort_by(.created_at)
                | last
                | if . == null then "missing" else "\(.status):\(.conclusion // "pending")" end
              ' "$TAP_RUNS"
            )"
            case "$TAP_STATE" in
              completed:success) passed=1; break ;;
              completed:*) echo "brew test-bot failed for $TAP_SHA: $TAP_STATE" >&2; exit 1 ;;
            esac
            echo "brew test-bot poll $attempt/60: $TAP_STATE"
            /bin/sleep 5
          done
          [[ "$passed" == "1" ]]

      - name: Verify the public cask and dispatch its install lifecycle
        shell: bash
        run: |
          set -euo pipefail
          readonly VERSION="${RELEASE_TAG#v}"
          readonly PKG_NAME="Wattson-v${VERSION}-macos-universal.pkg"
          EXPECTED_SHA="$(
            /usr/bin/awk -v name="$PKG_NAME" '$2 == name { print $1 }' \
              "$RUNNER_TEMP/wattson-release/SHA256SUMS.txt"
          )"
          readonly EXPECTED_SHA
          readonly PUBLIC_CASK="$RUNNER_TEMP/wattson-public-cask.rb"
          readonly CASK_URL="https://raw.githubusercontent.com/laleoarrow/homebrew-tap/main/Casks/wattson.rb"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]]

          matched=0
          for attempt in {1..12}; do
            /usr/bin/curl \
              --fail \
              --location \
              --proto '=https' \
              --retry 2 \
              --retry-delay 1 \
              --tlsv1.2 \
              --output "$PUBLIC_CASK" \
              "${CASK_URL}?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            if /usr/bin/grep -Fxq "  version \"$VERSION\"" "$PUBLIC_CASK" &&
               /usr/bin/grep -Fxq "  sha256 \"$EXPECTED_SHA\"" "$PUBLIC_CASK"; then
              matched=1
              break
            fi
            /bin/sleep 5
          done
          [[ "$matched" == "1" ]]

          gh workflow run homebrew-install-test.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field "release_tag=$RELEASE_TAG"
