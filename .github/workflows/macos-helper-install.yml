name: Wattson release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from the repository VERSION file
        required: true
        default: "3.0.6"
        type: string
      distribution_mode:
        description: Release signing policy
        required: true
        default: developer-id-notarized
        type: choice
        options:
          - developer-id-notarized
          - community-ad-hoc
  push:
    branches:
      - release-candidate

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build universal PKG and DMG once
    if: >-
      github.event_name == 'push' ||
      inputs.distribution_mode == 'community-ad-hoc' ||
      github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    environment: ${{ inputs.distribution_mode == 'developer-id-notarized' && 'release-signing' || 'community-ci' }}
    outputs:
      candidate_version: ${{ steps.resolve-version.outputs.version }}
      distribution_mode: ${{ steps.resolve-version.outputs.distribution_mode }}
      signing_team_id: ${{ steps.import-signing-assets.outputs.team_id }}
    env:
      WATTSON_VERSION: ${{ inputs.version }}
      REQUESTED_DISTRIBUTION_MODE: ${{ inputs.distribution_mode }}
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve and validate the candidate version
        id: resolve-version
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$WATTSON_VERSION" ]]; then
            WATTSON_VERSION="$(/usr/bin/tr -d '\r\n' < VERSION)"
          fi
          [[ "$WATTSON_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(/usr/bin/tr -d '\r\n' < VERSION)" == "$WATTSON_VERSION" ]]
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/release-candidate" ]]
            DISTRIBUTION_MODE="community-ad-hoc"
            NOTARIZE_RELEASE=0
          else
            DISTRIBUTION_MODE="$REQUESTED_DISTRIBUTION_MODE"
            case "$DISTRIBUTION_MODE" in
              developer-id-notarized)
                [[ "$GITHUB_REF" == "refs/heads/main" ]]
                NOTARIZE_RELEASE=1
                ;;
              community-ad-hoc)
                NOTARIZE_RELEASE=0
                ;;
              *)
                echo "unsupported distribution mode: $DISTRIBUTION_MODE" >&2
                exit 1
                ;;
            esac
          fi
          echo "WATTSON_VERSION=$WATTSON_VERSION" >> "$GITHUB_ENV"
          {
            echo "version=$WATTSON_VERSION"
            echo "distribution_mode=$DISTRIBUTION_MODE"
            echo "notarize=$NOTARIZE_RELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Run headless release tests
        shell: bash
        run: |
          set -euo pipefail
          swift test
          env -u WATTSON_RUN_INTERACTION /usr/bin/python3 -m unittest discover -s tests -v

      - name: Replay real AppKit interaction and animation lifecycles
        shell: bash
        run: |
          set -euo pipefail
          env WATTSON_FORCE_REDUCE_MOTION=0 \
            /bin/bash scripts/verify_interaction.sh
          env \
            WATTSON_FORCE_LEGACY_KNOB=1 \
            WATTSON_FORCE_REDUCE_MOTION=1 \
            WATTSON_FORCE_REDUCE_TRANSPARENCY=1 \
            /bin/bash scripts/verify_interaction.sh
          /bin/bash scripts/verify_animation_stress.sh

      - name: Import the Developer ID and notarization credentials
        id: import-signing-assets
        if: steps.resolve-version.outputs.distribution_mode == 'developer-id-notarized'
        shell: bash
        env:
          MACOS_APP_CERT_P12_BASE64: ${{ secrets.MACOS_APP_CERT_P12_BASE64 }}
          MACOS_APP_CERT_P12_PASSWORD: ${{ secrets.MACOS_APP_CERT_P12_PASSWORD }}
          MACOS_INSTALLER_CERT_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
          MACOS_INSTALLER_CERT_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_P12_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077

          for required_value in \
            "$MACOS_APP_CERT_P12_BASE64" \
            "$MACOS_APP_CERT_P12_PASSWORD" \
            "$MACOS_INSTALLER_CERT_P12_BASE64" \
            "$MACOS_INSTALLER_CERT_P12_PASSWORD" \
            "$APPLE_NOTARY_API_KEY_P8_BASE64" \
            "$APPLE_NOTARY_API_KEY_ID" \
            "$APPLE_NOTARY_API_ISSUER_ID" \
            "$APPLE_TEAM_ID"; do
            [[ -n "$required_value" ]]
          done
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$APPLE_NOTARY_API_KEY_ID" =~ ^[A-Za-z0-9]{10,64}$ ]]
          [[ "$APPLE_NOTARY_API_ISSUER_ID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]
          EXPECTED_TEAM_ID="$APPLE_TEAM_ID"
          readonly EXPECTED_TEAM_ID

          SIGNING_TEMP_DIR="$(/usr/bin/mktemp -d "$RUNNER_TEMP/wattson-signing.XXXXXX")"
          case "$SIGNING_TEMP_DIR" in
            "$RUNNER_TEMP"/wattson-signing.*) ;;
            *) echo "signing directory escaped RUNNER_TEMP" >&2; exit 1 ;;
          esac
          SIGNING_KEYCHAIN="$SIGNING_TEMP_DIR/wattson-signing.keychain-db"
          APP_CERT_PATH="$SIGNING_TEMP_DIR/developer-id-application.p12"
          INSTALLER_CERT_PATH="$SIGNING_TEMP_DIR/developer-id-installer.p12"
          NOTARY_KEY_PATH="$SIGNING_TEMP_DIR/AuthKey_${APPLE_NOTARY_API_KEY_ID}.p8"
          {
            echo "SIGNING_TEMP_DIR=$SIGNING_TEMP_DIR"
            echo "SIGNING_KEYCHAIN=$SIGNING_KEYCHAIN"
          } >> "$GITHUB_ENV"

          /usr/bin/printf '%s' "$MACOS_APP_CERT_P12_BASE64" \
            | /usr/bin/base64 -D > "$APP_CERT_PATH"
          /usr/bin/printf '%s' "$MACOS_INSTALLER_CERT_P12_BASE64" \
            | /usr/bin/base64 -D > "$INSTALLER_CERT_PATH"
          /usr/bin/printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" \
            | /usr/bin/base64 -D > "$NOTARY_KEY_PATH"
          [[ -s "$APP_CERT_PATH" && -s "$INSTALLER_CERT_PATH" && -s "$NOTARY_KEY_PATH" ]]
          /usr/bin/grep -Fxq -- '-----BEGIN PRIVATE KEY-----' "$NOTARY_KEY_PATH"

          KEYCHAIN_PASSWORD="$(/usr/bin/openssl rand -base64 48)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          /usr/bin/security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          /usr/bin/security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          /usr/bin/security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          /usr/bin/security import "$APP_CERT_PATH" \
            -k "$SIGNING_KEYCHAIN" \
            -P "$MACOS_APP_CERT_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security >/dev/null

          APP_IDENTITIES="$SIGNING_TEMP_DIR/application-identities.txt"
          /usr/bin/security find-identity -v "$SIGNING_KEYCHAIN" \
            > "$APP_IDENTITIES"
          [[ "$(/usr/bin/grep -Ec '^[[:space:]]*[0-9]+\) [[:xdigit:]]{40} ' "$APP_IDENTITIES")" == "1" ]]
          [[ "$(/usr/bin/grep -Fc '"Developer ID Application:' "$APP_IDENTITIES")" == "1" ]]
          [[ "$(/usr/bin/grep -Fc '"Developer ID Installer:' "$APP_IDENTITIES")" == "0" ]]
          APP_IDENTITY_LINE="$(/usr/bin/grep -F '"Developer ID Application:' "$APP_IDENTITIES")"
          [[ "$APP_IDENTITY_LINE" == *" ($EXPECTED_TEAM_ID)\"" ]]

          /usr/bin/security import "$INSTALLER_CERT_PATH" \
            -k "$SIGNING_KEYCHAIN" \
            -P "$MACOS_INSTALLER_CERT_P12_PASSWORD" \
            -T /usr/bin/productbuild \
            -T /usr/bin/security >/dev/null
          /bin/rm -f -- "$APP_CERT_PATH" "$INSTALLER_CERT_PATH"
          /usr/bin/security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$SIGNING_KEYCHAIN" >/dev/null
          /usr/bin/security list-keychains -d user -s "$SIGNING_KEYCHAIN"

          ALL_IDENTITIES="$SIGNING_TEMP_DIR/all-identities.txt"
          /usr/bin/security find-identity -v "$SIGNING_KEYCHAIN" \
            > "$ALL_IDENTITIES"
          [[ "$(/usr/bin/grep -Ec '^[[:space:]]*[0-9]+\) [[:xdigit:]]{40} ' "$ALL_IDENTITIES")" == "2" ]]
          [[ "$(/usr/bin/grep -Fc '"Developer ID Application:' "$ALL_IDENTITIES")" == "1" ]]
          [[ "$(/usr/bin/grep -Fc '"Developer ID Installer:' "$ALL_IDENTITIES")" == "1" ]]
          APP_IDENTITY_LINE="$(/usr/bin/grep -F '"Developer ID Application:' "$ALL_IDENTITIES")"
          INSTALLER_IDENTITY_LINE="$(/usr/bin/grep -F '"Developer ID Installer:' "$ALL_IDENTITIES")"
          [[ "$APP_IDENTITY_LINE" == *" ($EXPECTED_TEAM_ID)\"" ]]
          [[ "$INSTALLER_IDENTITY_LINE" == *" ($EXPECTED_TEAM_ID)\"" ]]
          APP_IDENTITY_SHA1="$(/usr/bin/awk '{ print $2 }' <<< "$APP_IDENTITY_LINE")"
          INSTALLER_IDENTITY_SHA1="$(/usr/bin/awk '{ print $2 }' <<< "$INSTALLER_IDENTITY_LINE")"
          [[ "$APP_IDENTITY_SHA1" =~ ^[[:xdigit:]]{40}$ ]]
          [[ "$INSTALLER_IDENTITY_SHA1" =~ ^[[:xdigit:]]{40}$ ]]

          {
            echo "WATTSON_DEVELOPER_ID_APP=$APP_IDENTITY_SHA1"
            echo "WATTSON_DEVELOPER_ID_INSTALLER=$INSTALLER_IDENTITY_SHA1"
            echo "WATTSON_NOTARY_KEY_PATH=$NOTARY_KEY_PATH"
            echo "WATTSON_NOTARY_KEY_ID=$APPLE_NOTARY_API_KEY_ID"
            echo "WATTSON_NOTARY_ISSUER=$APPLE_NOTARY_API_ISSUER_ID"
            echo "WATTSON_EXPECT_TEAM_ID=$EXPECTED_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "team_id=$EXPECTED_TEAM_ID" >> "$GITHUB_OUTPUT"

      - name: Build and verify the release artifacts
        shell: bash
        env:
          WATTSON_NOTARIZE: ${{ steps.resolve-version.outputs.notarize }}
        run: |
          set -o pipefail
          /bin/bash scripts/release.sh "$WATTSON_VERSION" \
            2>&1 | /usr/bin/tee "$RUNNER_TEMP/wattson-release-build.log"

      - name: Scrub signing credentials
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          umask 077
          cleanup_status=0
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            case "$SIGNING_KEYCHAIN" in
              "$RUNNER_TEMP"/wattson-signing.*/*.keychain-db)
                if [[ -e "$SIGNING_KEYCHAIN" ]]; then
                  /usr/bin/security lock-keychain "$SIGNING_KEYCHAIN" >/dev/null 2>&1 || true
                  /usr/bin/security delete-keychain "$SIGNING_KEYCHAIN" >/dev/null 2>&1 \
                    || cleanup_status=1
                fi
                /bin/rm -f -- "$SIGNING_KEYCHAIN" || cleanup_status=1
                ;;
              *) echo "refusing to remove an unexpected keychain path" >&2; cleanup_status=1 ;;
            esac
          fi
          if [[ -n "${SIGNING_TEMP_DIR:-}" ]]; then
            case "$SIGNING_TEMP_DIR" in
              "$RUNNER_TEMP"/wattson-signing.*)
                /bin/rm -rf -- "$SIGNING_TEMP_DIR" || cleanup_status=1
                ;;
              *) echo "refusing to remove an unexpected signing directory" >&2; cleanup_status=1 ;;
            esac
          fi
          exit "$cleanup_status"

      - name: Upload the exact release candidate bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Wattson-release-candidate-v${{ steps.resolve-version.outputs.version }}
          path: |
            dist/Wattson-v${{ env.WATTSON_VERSION }}-macos-universal.pkg
            dist/Wattson-v${{ env.WATTSON_VERSION }}-macos-universal.dmg
            dist/Wattson-v${{ env.WATTSON_VERSION }}-release-info.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload the release build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wattson-release-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wattson-release-build.log
          if-no-files-found: warn
          retention-days: 7

  install:
    name: Install on ${{ matrix.runner }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      WATTSON_VERSION: ${{ needs.build.outputs.candidate_version }}
      WATTSON_DISTRIBUTION_MODE: ${{ needs.build.outputs.distribution_mode }}
      EXPECTED_TEAM_ID: ${{ needs.build.outputs.signing_team_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            test_v2_upgrade: true
          - runner: macos-15
            test_v2_upgrade: true
          - runner: macos-26
            test_v2_upgrade: true
          - runner: macos-15-intel
            test_v2_upgrade: false
          - runner: macos-26-intel
            test_v2_upgrade: false
    steps:
      - name: Check out the candidate lifecycle scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the single release build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Wattson-release-candidate-v${{ env.WATTSON_VERSION }}
          path: ${{ runner.temp }}/wattson-release

      - name: Verify checksums, universal payloads, and DMG identity
        shell: bash
        run: |
          set -euo pipefail

          readonly RELEASE_DIR="$RUNNER_TEMP/wattson-release"
          readonly PKG_NAME="Wattson-v${WATTSON_VERSION}-macos-universal.pkg"
          readonly DMG_NAME="Wattson-v${WATTSON_VERSION}-macos-universal.dmg"
          readonly INFO_NAME="Wattson-v${WATTSON_VERSION}-release-info.txt"
          readonly PKG_PATH="$RELEASE_DIR/$PKG_NAME"
          readonly DMG_PATH="$RELEASE_DIR/$DMG_NAME"
          readonly INFO_PATH="$RELEASE_DIR/$INFO_NAME"
          readonly CHECKSUM_PATH="$RELEASE_DIR/SHA256SUMS.txt"

          assert_metadata_line() {
            local expected="$1"
            [[ "$(/usr/bin/awk -v expected="$expected" \
              '$0 == expected { count++ } END { print count + 0 }' "$INFO_PATH")" == "1" ]]
          }

          assert_metadata_key_once() {
            local expected_key="$1"
            [[ "$(/usr/bin/awk -F= -v expected_key="$expected_key" \
              '$1 == expected_key { count++ } END { print count + 0 }' "$INFO_PATH")" == "1" ]]
          }

          assert_runner_temp_path() {
            case "$1" in
              "$RUNNER_TEMP"/*) ;;
              *) echo "path escaped RUNNER_TEMP: $1" >&2; exit 1 ;;
            esac
          }

          [[ "$WATTSON_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          for artifact in "$PKG_PATH" "$DMG_PATH" "$INFO_PATH" "$CHECKSUM_PATH"; do
            [[ -f "$artifact" && ! -L "$artifact" ]]
          done
          [[ "$(/usr/bin/wc -l < "$CHECKSUM_PATH" | /usr/bin/tr -d ' ')" == "3" ]]
          /usr/bin/grep -Eq "^[0-9a-f]{64}  ${PKG_NAME}$" "$CHECKSUM_PATH"
          /usr/bin/grep -Eq "^[0-9a-f]{64}  ${DMG_NAME}$" "$CHECKSUM_PATH"
          /usr/bin/grep -Eq "^[0-9a-f]{64}  ${INFO_NAME}$" "$CHECKSUM_PATH"
          (
            cd "$RELEASE_DIR"
            /usr/bin/shasum -a 256 -c SHA256SUMS.txt
          )
          assert_metadata_line "version=$WATTSON_VERSION"
          assert_metadata_line "architectures=arm64,x86_64"
          assert_metadata_line "minimum_macos=12.0"
          assert_metadata_line "install_path=/Applications/Wattson.app"
          for metadata_key in \
            distribution_mode \
            app_signature \
            helper_signature \
            package_signature \
            dmg_signature \
            notarized \
            stapled; do
            assert_metadata_key_once "$metadata_key"
          done
          case "$WATTSON_DISTRIBUTION_MODE" in
            community-ad-hoc)
              [[ -z "$EXPECTED_TEAM_ID" ]]
              assert_metadata_line "distribution_mode=community-ad-hoc"
              assert_metadata_line "app_signature=ad-hoc"
              assert_metadata_line "helper_signature=ad-hoc"
              assert_metadata_line "package_signature=unsigned"
              assert_metadata_line "dmg_signature=unsigned"
              assert_metadata_line "notarized=no"
              assert_metadata_line "stapled=no"
              SIGNED_RELEASE=0
              ;;
            developer-id-notarized)
              [[ "$EXPECTED_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
              assert_metadata_line "distribution_mode=developer-id"
              assert_metadata_line "app_signature=developer-id"
              assert_metadata_line "helper_signature=developer-id"
              assert_metadata_line "package_signature=developer-id"
              assert_metadata_line "dmg_signature=developer-id"
              assert_metadata_line "notarized=yes"
              assert_metadata_line "stapled=yes"
              SIGNED_RELEASE=1
              ;;
            *)
              echo "unexpected candidate distribution mode: $WATTSON_DISTRIBUTION_MODE" >&2
              exit 1
              ;;
          esac
          readonly SIGNED_RELEASE

          EXPAND_BASE="$(/usr/bin/mktemp -d "$RUNNER_TEMP/wattson-pkg.XXXXXX")"
          EXPAND_DIR="$EXPAND_BASE/expanded"
          MOUNT_DIR="$(/usr/bin/mktemp -d "$RUNNER_TEMP/wattson-dmg.XXXXXX")"
          assert_runner_temp_path "$EXPAND_BASE"
          assert_runner_temp_path "$MOUNT_DIR"
          MOUNTED=0
          cleanup() {
            local status="$?"
            trap - EXIT
            if [[ "$MOUNTED" == "1" ]]; then
              /usr/bin/hdiutil detach "$MOUNT_DIR" >/dev/null 2>&1 || status=1
            fi
            /bin/rm -rf -- "$EXPAND_BASE" "$MOUNT_DIR" || status=1
            exit "$status"
          }
          trap cleanup EXIT

          /usr/sbin/pkgutil --expand-full "$PKG_PATH" "$EXPAND_DIR"
          PACKAGED_APP_BIN="$(
            /usr/bin/find "$EXPAND_DIR" -type f \
              -path '*/Payload/Applications/Wattson.app/Contents/MacOS/Wattson' \
              -print -quit
          )"
          PACKAGED_APP_INFO="$(
            /usr/bin/find "$EXPAND_DIR" -type f \
              -path '*/Payload/Applications/Wattson.app/Contents/Info.plist' \
              -print -quit
          )"
          PACKAGED_HELPER="$(
            /usr/bin/find "$EXPAND_DIR" -type f \
              -path '*/Payload/Library/PrivilegedHelperTools/com.leoarrow.wattson.helper' \
              -print -quit
          )"
          [[ -n "$PACKAGED_APP_BIN" && -n "$PACKAGED_APP_INFO" && -n "$PACKAGED_HELPER" ]]
          PACKAGED_APP_DIR="${PACKAGED_APP_BIN%/Contents/MacOS/Wattson}"
          readonly PACKAGED_APP_DIR
          /usr/bin/xcrun lipo "$PACKAGED_APP_BIN" -verify_arch arm64 x86_64
          /usr/bin/xcrun lipo "$PACKAGED_HELPER" -verify_arch arm64 x86_64
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PACKAGED_APP_INFO")" == "$WATTSON_VERSION" ]]

          if [[ "$SIGNED_RELEASE" == "1" ]]; then
            readonly PKG_SIGNATURE_INFO="$EXPAND_BASE/pkg-signature.txt"
            readonly APP_SIGNATURE_INFO="$EXPAND_BASE/app-signature.txt"
            readonly HELPER_SIGNATURE_INFO="$EXPAND_BASE/helper-signature.txt"
            readonly DMG_SIGNATURE_INFO="$EXPAND_BASE/dmg-signature.txt"

            /usr/sbin/pkgutil --check-signature "$PKG_PATH" \
              > "$PKG_SIGNATURE_INFO"
            /usr/bin/grep -Fq \
              "Developer ID Installer:" "$PKG_SIGNATURE_INFO"
            /usr/bin/grep -Fq \
              "($EXPECTED_TEAM_ID)" "$PKG_SIGNATURE_INFO"
            /usr/bin/grep -Eq \
              '(Signed with a trusted timestamp|Timestamp)' "$PKG_SIGNATURE_INFO"

            /usr/bin/codesign --verify --deep --strict --verbose=2 "$PACKAGED_APP_DIR"
            /usr/bin/codesign -d --verbose=4 "$PACKAGED_APP_DIR" \
              2> "$APP_SIGNATURE_INFO"
            /usr/bin/grep -Fq "Authority=Developer ID Application:" "$APP_SIGNATURE_INFO"
            /usr/bin/grep -Fxq "TeamIdentifier=$EXPECTED_TEAM_ID" "$APP_SIGNATURE_INFO"
            /usr/bin/grep -Eq '^CodeDirectory .*flags=.*\(runtime\)' "$APP_SIGNATURE_INFO"
            /usr/bin/grep -Eq '^Timestamp=.+' "$APP_SIGNATURE_INFO"

            /usr/bin/codesign --verify --strict --verbose=2 "$PACKAGED_HELPER"
            /usr/bin/codesign -d --verbose=4 "$PACKAGED_HELPER" \
              2> "$HELPER_SIGNATURE_INFO"
            /usr/bin/grep -Fq "Authority=Developer ID Application:" "$HELPER_SIGNATURE_INFO"
            /usr/bin/grep -Fxq "TeamIdentifier=$EXPECTED_TEAM_ID" "$HELPER_SIGNATURE_INFO"
            /usr/bin/grep -Eq '^CodeDirectory .*flags=.*\(runtime\)' "$HELPER_SIGNATURE_INFO"
            /usr/bin/grep -Eq '^Timestamp=.+' "$HELPER_SIGNATURE_INFO"

            /usr/bin/codesign --verify --strict --verbose=2 "$DMG_PATH"
            /usr/bin/codesign -d --verbose=4 "$DMG_PATH" \
              2> "$DMG_SIGNATURE_INFO"
            /usr/bin/grep -Fq "Authority=Developer ID Application:" "$DMG_SIGNATURE_INFO"
            /usr/bin/grep -Fxq "TeamIdentifier=$EXPECTED_TEAM_ID" "$DMG_SIGNATURE_INFO"
            /usr/bin/grep -Eq '^Timestamp=.+' "$DMG_SIGNATURE_INFO"

            /usr/bin/xcrun stapler validate -v "$PKG_PATH"
            /usr/bin/xcrun stapler validate -v "$DMG_PATH"
            /usr/sbin/spctl --assess --type execute --verbose=4 "$PACKAGED_APP_DIR"
            /usr/sbin/spctl --assess --type install --verbose=4 "$PKG_PATH"
            /usr/sbin/spctl --assess \
              --type open \
              --context context:primary-signature \
              --verbose=4 \
              "$DMG_PATH"
          fi

          /usr/bin/hdiutil attach \
            -nobrowse \
            -readonly \
            -mountpoint "$MOUNT_DIR" \
            "$DMG_PATH" >/dev/null
          MOUNTED=1
          [[ -f "$MOUNT_DIR/$PKG_NAME" && ! -L "$MOUNT_DIR/$PKG_NAME" ]]
          /usr/bin/cmp -s "$PKG_PATH" "$MOUNT_DIR/$PKG_NAME"
          /usr/bin/hdiutil detach "$MOUNT_DIR" >/dev/null
          MOUNTED=0

      - name: Test first install and disabled-service reinstall
        shell: bash
        run: |
          set -euo pipefail

          readonly PKG_PATH="$RUNNER_TEMP/wattson-release/Wattson-v${WATTSON_VERSION}-macos-universal.pkg"
          readonly APP_DIR="/Applications/Wattson.app"
          readonly APP_BIN="$APP_DIR/Contents/MacOS/Wattson"
          readonly HELPER_LABEL="com.leoarrow.wattson.helper"
          readonly HELPER_TARGET="system/$HELPER_LABEL"
          readonly HELPER_BIN="/Library/PrivilegedHelperTools/$HELPER_LABEL"
          readonly HELPER_PLIST="/Library/LaunchDaemons/$HELPER_LABEL.plist"
          readonly HELPER_SOCKET="/var/run/wattson-helper.sock"
          readonly RECEIPT="com.leoarrow.wattson.pkg"
          readonly LOGIN_LABEL="com.leoarrow.wattson.login"
          LOGIN_TARGET="gui/$(/usr/bin/id -u)/$LOGIN_LABEL"
          readonly LOGIN_TARGET
          readonly LOGIN_PLIST="$HOME/Library/LaunchAgents/$LOGIN_LABEL.plist"
          readonly LEGACY_APP="$HOME/Applications/Wattson.app"
          readonly USER_SUPPORT="$HOME/Library/Application Support/Wattson"
          readonly USER_CONTAINER="$HOME/Library/Containers/com.leoarrow.wattson"
          readonly USER_PREFERENCES="$HOME/Library/Preferences/com.leoarrow.wattson.plist"
          APP_PID=""

          cleanup() {
            local status="$?"
            local cleanup_failed=0
            local disabled_state
            local residual
            trap - EXIT
            set +e

            if [[ -n "$APP_PID" ]]; then
              /bin/kill "$APP_PID" >/dev/null 2>&1 || true
              wait "$APP_PID" >/dev/null 2>&1 || true
              APP_PID=""
            fi
            /bin/launchctl bootout "$LOGIN_TARGET" >/dev/null 2>&1 || true
            /bin/rm -f -- "$LOGIN_PLIST" "$USER_PREFERENCES" || cleanup_failed=1
            /usr/bin/sudo -n /bin/launchctl bootout "$HELPER_TARGET" >/dev/null 2>&1 || true
            /usr/bin/sudo -n /bin/launchctl enable "$HELPER_TARGET" >/dev/null 2>&1 \
              || cleanup_failed=1
            /usr/bin/sudo -n /bin/rm -f -- \
              "$HELPER_SOCKET" "$HELPER_PLIST" "$HELPER_BIN" || cleanup_failed=1
            /usr/bin/sudo -n /bin/rm -rf -- "$APP_DIR" || cleanup_failed=1
            /bin/rm -rf -- "$LEGACY_APP" "$USER_SUPPORT" "$USER_CONTAINER" \
              || cleanup_failed=1
            /usr/bin/sudo -n /usr/sbin/pkgutil --forget "$RECEIPT" >/dev/null 2>&1 || true

            if /usr/bin/sudo -n /bin/launchctl print "$HELPER_TARGET" >/dev/null 2>&1; then
              echo "helper service remains registered after cleanup" >&2
              cleanup_failed=1
            fi
            disabled_state="$(/usr/bin/sudo -n /bin/launchctl print-disabled system 2>/dev/null)" \
              || cleanup_failed=1
            case "$disabled_state" in
              *"\"$HELPER_LABEL\" => disabled"*|*"\"$HELPER_LABEL\" => true"*)
                echo "helper remains disabled after cleanup" >&2
                cleanup_failed=1
                ;;
            esac
            for residual in "$APP_DIR" "$HELPER_BIN" "$HELPER_PLIST" "$HELPER_SOCKET" "$LEGACY_APP"; do
              if [[ -e "$residual" || -L "$residual" ]]; then
                echo "cleanup left $residual" >&2
                cleanup_failed=1
              fi
            done
            if [[ "$status" == "0" && "$cleanup_failed" != "0" ]]; then
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT

          verify_install() {
            local disabled_state
            [[ -d "$APP_DIR" && ! -L "$APP_DIR" ]]
            [[ -f "$APP_BIN" && ! -L "$APP_BIN" ]]
            [[ -f "$HELPER_BIN" && ! -L "$HELPER_BIN" ]]
            [[ -f "$HELPER_PLIST" && ! -L "$HELPER_PLIST" ]]
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_DIR/Contents/Info.plist")" == "$WATTSON_VERSION" ]]
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_DIR/Contents/Info.plist")" == "com.leoarrow.wattson" ]]
            /usr/bin/xcrun lipo "$APP_BIN" -verify_arch arm64 x86_64
            /usr/bin/xcrun lipo "$HELPER_BIN" -verify_arch arm64 x86_64
            /usr/bin/codesign --verify --deep --strict "$APP_DIR"
            /usr/bin/sudo -n /usr/bin/codesign --verify --strict "$HELPER_BIN"
            [[ "$(/usr/bin/sudo -n /usr/bin/stat -f '%u:%g:%OLp' "$HELPER_BIN")" == "0:0:544" ]]
            [[ "$(/usr/bin/sudo -n /usr/bin/stat -f '%u:%g:%OLp' "$HELPER_PLIST")" == "0:0:644" ]]
            /usr/bin/sudo -n /bin/launchctl print "$HELPER_TARGET" >/dev/null
            /usr/bin/sudo -n "$HELPER_BIN" --health-probe
            "$APP_BIN" --helper-health-probe
            # Hosted Mac minis have no internal battery, but SMC availability
            # is independent. Exercise the shipped getPower IPC when the
            # runner exposes the fixed keys; older runners may legitimately
            # report them unavailable and retain the public IOKit fallback.
            "$APP_BIN" --helper-power-probe \
              || echo "fixed SMC power keys unavailable on this runner"
            [[ "$(/usr/sbin/pkgutil --pkg-info "$RECEIPT" | /usr/bin/awk -F': ' '$1 == "version" { print $2 }')" == "$WATTSON_VERSION" ]]
            disabled_state="$(/usr/bin/sudo -n /bin/launchctl print-disabled system)"
            case "$disabled_state" in
              *"\"$HELPER_LABEL\" => disabled"*|*"\"$HELPER_LABEL\" => true"*) return 1 ;;
            esac
          }

          verify_app_launch_stability() {
            local attempt
            local battery_registry
            local exit_status
            local has_battery=0

            battery_registry="$(/usr/sbin/ioreg -r -c AppleSmartBattery 2>/dev/null)"
            if [[ "$battery_registry" == *AppleSmartBattery* ]]; then
              has_battery=1
            fi

            "$APP_BIN" >"$RUNNER_TEMP/wattson-app-launch.log" 2>&1 &
            APP_PID="$!"
            for ((attempt = 0; attempt < 20; attempt++)); do
              if ! /bin/kill -0 "$APP_PID" >/dev/null 2>&1; then
                if wait "$APP_PID"; then
                  exit_status=0
                else
                  exit_status="$?"
                fi
                APP_PID=""
                if [[ "$has_battery" == "0" && "$exit_status" == "0" ]]; then
                  echo "Wattson exited cleanly because this hosted runner has no AppleSmartBattery."
                  return 0
                fi
                echo "Wattson exited during the packaged-app launch check (status=$exit_status, AppleSmartBattery=$has_battery)." >&2
                /bin/cat "$RUNNER_TEMP/wattson-app-launch.log" >&2 || true
                return 1
              fi
              /bin/sleep 0.1
            done
            /bin/kill "$APP_PID"
            wait "$APP_PID" >/dev/null 2>&1 || true
            APP_PID=""
          }

          [[ "${GITHUB_ACTIONS:-}" == "true" ]]
          [[ "${RUNNER_OS:-}" == "macOS" ]]
          [[ "${RUNNER_ENVIRONMENT:-}" == "github-hosted" ]]
          [[ -f "$PKG_PATH" && ! -L "$PKG_PATH" ]]
          /usr/bin/sudo -n /usr/bin/true
          for initial_path in "$APP_DIR" "$HELPER_BIN" "$HELPER_PLIST" "$HELPER_SOCKET" "$LEGACY_APP"; do
            [[ ! -e "$initial_path" && ! -L "$initial_path" ]]
          done
          if /usr/sbin/pkgutil --pkg-info "$RECEIPT" >/dev/null 2>&1; then
            echo "fresh runner unexpectedly has a Wattson package receipt" >&2
            exit 1
          fi

          echo "Installing the candidate on a fresh runner..."
          /usr/bin/sudo -n /usr/sbin/installer \
            -verboseR \
            -pkg "$PKG_PATH" \
            -target / \
            2>&1 | /usr/bin/tee -a "$RUNNER_TEMP/wattson-install.log"
          verify_install
          verify_app_launch_stability

          echo "Reinstalling after an explicit launchd disable..."
          /usr/bin/sudo -n /bin/launchctl bootout "$HELPER_TARGET"
          /usr/bin/sudo -n /bin/launchctl disable "$HELPER_TARGET"
          disabled_state="$(/usr/bin/sudo -n /bin/launchctl print-disabled system)"
          case "$disabled_state" in
            *"\"$HELPER_LABEL\" => disabled"*|*"\"$HELPER_LABEL\" => true"*) ;;
            *) echo "launchd did not record the disabled state" >&2; exit 1 ;;
          esac
          /usr/bin/sudo -n /usr/sbin/installer \
            -verboseR \
            -pkg "$PKG_PATH" \
            -target / \
            2>&1 | /usr/bin/tee -a "$RUNNER_TEMP/wattson-install.log"
          verify_install

          echo "Running the shipped uninstaller, then reinstalling once more..."
          /bin/bash scripts/uninstall.sh \
            2>&1 | /usr/bin/tee -a "$RUNNER_TEMP/wattson-uninstall.log"
          for removed_path in "$APP_DIR" "$HELPER_BIN" "$HELPER_PLIST" "$HELPER_SOCKET" "$LEGACY_APP"; do
            [[ ! -e "$removed_path" && ! -L "$removed_path" ]]
          done
          if /usr/sbin/pkgutil --pkg-info "$RECEIPT" >/dev/null 2>&1; then
            echo "the shipped uninstaller left the package receipt" >&2
            exit 1
          fi
          if /usr/bin/sudo -n /bin/launchctl print "$HELPER_TARGET" >/dev/null 2>&1; then
            echo "the shipped uninstaller left the helper registered" >&2
            exit 1
          fi

          /usr/bin/sudo -n /usr/sbin/installer \
            -verboseR \
            -pkg "$PKG_PATH" \
            -target / \
            2>&1 | /usr/bin/tee -a "$RUNNER_TEMP/wattson-install.log"
          verify_install
          verify_app_launch_stability

          echo "First install, disabled-service reinstall, uninstall, reinstall, app launch, and cleanup checks passed."

      - name: Test upgrade from the published v2.1.5 release
        if: matrix.test_v2_upgrade
        shell: bash
        run: |
          set -euo pipefail

          readonly V2_VERSION="2.1.5"
          readonly V2_SHA256="1a5054dfbc3f3a4ff9518620d3a9b49c282ff42973f9952a076470c05cf4caf6"
          readonly V2_DMG="$RUNNER_TEMP/Wattson-v${V2_VERSION}.dmg"
          readonly V2_URL="https://github.com/laleoarrow/battery-monitor/releases/download/v${V2_VERSION}/Wattson-v${V2_VERSION}.dmg"
          readonly PKG_PATH="$RUNNER_TEMP/wattson-release/Wattson-v${WATTSON_VERSION}-macos-universal.pkg"
          readonly APP_DIR="/Applications/Wattson.app"
          readonly APP_BIN="$APP_DIR/Contents/MacOS/Wattson"
          readonly LEGACY_APP="$HOME/Applications/Wattson.app"
          readonly HELPER_LABEL="com.leoarrow.wattson.helper"
          readonly HELPER_TARGET="system/$HELPER_LABEL"
          readonly HELPER_BIN="/Library/PrivilegedHelperTools/$HELPER_LABEL"
          readonly HELPER_PLIST="/Library/LaunchDaemons/$HELPER_LABEL.plist"
          readonly HELPER_SOCKET="/var/run/wattson-helper.sock"
          readonly RECEIPT="com.leoarrow.wattson.pkg"
          readonly LOGIN_LABEL="com.leoarrow.wattson.login"
          LOGIN_TARGET="gui/$(/usr/bin/id -u)/$LOGIN_LABEL"
          readonly LOGIN_TARGET
          readonly LOGIN_PLIST="$HOME/Library/LaunchAgents/$LOGIN_LABEL.plist"
          MOUNT_DIR="$(/usr/bin/mktemp -d "$RUNNER_TEMP/wattson-v2-dmg.XXXXXX")"
          V2_STAGE=""
          MOUNTED=0

          cleanup() {
            local status="$?"
            local cleanup_failed=0
            local residual
            trap - EXIT
            set +e
            if [[ "$MOUNTED" == "1" ]]; then
              /usr/bin/hdiutil detach "$MOUNT_DIR" >/dev/null 2>&1 || cleanup_failed=1
            fi
            if [[ -n "$V2_STAGE" ]]; then
              case "$V2_STAGE" in
                /private/tmp/com.leoarrow.wattson.v2-ci.*)
                  /usr/bin/sudo -n /bin/rm -rf -- "$V2_STAGE" || cleanup_failed=1
                  ;;
                *) echo "v2 root stage escaped its fixed prefix" >&2; cleanup_failed=1 ;;
              esac
            fi
            /bin/launchctl bootout "$LOGIN_TARGET" >/dev/null 2>&1 || true
            /bin/rm -f -- "$LOGIN_PLIST" || cleanup_failed=1
            /usr/bin/sudo -n /bin/launchctl bootout "$HELPER_TARGET" >/dev/null 2>&1 || true
            /usr/bin/sudo -n /bin/launchctl enable "$HELPER_TARGET" >/dev/null 2>&1 \
              || cleanup_failed=1
            /usr/bin/sudo -n /bin/rm -f -- \
              "$HELPER_SOCKET" "$HELPER_PLIST" "$HELPER_BIN" || cleanup_failed=1
            /usr/bin/sudo -n /bin/rm -rf -- "$APP_DIR" || cleanup_failed=1
            /bin/rm -rf -- "$LEGACY_APP" "$MOUNT_DIR" || cleanup_failed=1
            /usr/bin/sudo -n /usr/sbin/pkgutil --forget "$RECEIPT" >/dev/null 2>&1 || true
            if /usr/bin/sudo -n /bin/launchctl print "$HELPER_TARGET" >/dev/null 2>&1; then
              echo "helper service remains registered after v2 upgrade cleanup" >&2
              cleanup_failed=1
            fi
            for residual in "$APP_DIR" "$HELPER_BIN" "$HELPER_PLIST" "$HELPER_SOCKET" "$LEGACY_APP"; do
              if [[ -e "$residual" || -L "$residual" ]]; then
                echo "v2 upgrade cleanup left $residual" >&2
                cleanup_failed=1
              fi
            done
            if [[ "$status" == "0" && "$cleanup_failed" != "0" ]]; then
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT

          [[ "$(/usr/bin/uname -m)" == "arm64" ]]
          [[ -f "$PKG_PATH" && ! -L "$PKG_PATH" ]]
          /usr/bin/curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 3 \
            --retry-delay 2 \
            --tlsv1.2 \
            --output "$V2_DMG" \
            "$V2_URL"
          [[ "$(/usr/bin/shasum -a 256 "$V2_DMG" | /usr/bin/awk '{ print $1 }')" == "$V2_SHA256" ]]

          /usr/bin/hdiutil attach \
            -nobrowse \
            -readonly \
            -mountpoint "$MOUNT_DIR" \
            "$V2_DMG" >/dev/null
          MOUNTED=1
          readonly V2_INSTALLER="$MOUNT_DIR/Install Wattson.app"
          readonly V2_RESOURCES="$V2_INSTALLER/Contents/Resources"
          [[ -d "$V2_INSTALLER" && ! -L "$V2_INSTALLER" ]]
          /usr/bin/codesign --verify --deep --strict "$V2_INSTALLER"
          "$V2_INSTALLER/Contents/MacOS/Install Wattson" --verify

          /bin/mkdir -p "$HOME/Applications"
          /usr/bin/ditto -x -k "$V2_RESOURCES/Payload/Wattson.zip" "$HOME/Applications"
          [[ -d "$LEGACY_APP" && ! -L "$LEGACY_APP" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$LEGACY_APP/Contents/Info.plist")" == "$V2_VERSION" ]]
          /usr/bin/codesign --verify --deep --strict "$LEGACY_APP"

          /bin/mkdir -p "$HOME/Library/LaunchAgents"
          /usr/bin/plutil -create xml1 "$LOGIN_PLIST"
          /usr/libexec/PlistBuddy -c "Add :Label string $LOGIN_LABEL" "$LOGIN_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :ProgramArguments array' "$LOGIN_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :ProgramArguments:0 string /usr/bin/open' "$LOGIN_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :ProgramArguments:1 string -gj' "$LOGIN_PLIST"
          /usr/libexec/PlistBuddy -c "Add :ProgramArguments:2 string $LEGACY_APP" "$LOGIN_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :RunAtLoad bool true' "$LOGIN_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LimitLoadToSessionType string Aqua' "$LOGIN_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :ProcessType string Interactive' "$LOGIN_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :AssociatedBundleIdentifiers array' "$LOGIN_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :AssociatedBundleIdentifiers:0 string com.leoarrow.wattson' "$LOGIN_PLIST"
          /bin/chmod 644 "$LOGIN_PLIST"
          /bin/launchctl bootstrap "gui/$(/usr/bin/id -u)" "$LOGIN_PLIST"
          /bin/launchctl print "$LOGIN_TARGET" >/dev/null

          V2_STAGE="$(
            /usr/bin/sudo -n /usr/bin/mktemp \
              -d /private/tmp/com.leoarrow.wattson.v2-ci.XXXXXX
          )"
          case "$V2_STAGE" in
            /private/tmp/com.leoarrow.wattson.v2-ci.*) ;;
            *) echo "invalid v2 root stage" >&2; exit 1 ;;
          esac
          /usr/bin/sudo -n /usr/bin/install -d -o root -g wheel -m 700 "$V2_STAGE/Payload"
          /usr/bin/sudo -n /usr/bin/install -o root -g wheel -m 500 \
            "$V2_RESOURCES/install-helper.sh" "$V2_STAGE/install-helper.sh"
          /usr/bin/sudo -n /usr/bin/install -o root -g wheel -m 500 \
            "$V2_RESOURCES/Payload/$HELPER_LABEL" "$V2_STAGE/Payload/$HELPER_LABEL"
          /usr/bin/sudo -n /usr/bin/install -o root -g wheel -m 400 \
            "$V2_RESOURCES/Payload/$HELPER_LABEL.plist" "$V2_STAGE/Payload/$HELPER_LABEL.plist"
          /usr/bin/sudo -n /usr/bin/env -i \
            PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            HOME=/var/root \
            USER=root \
            LOGNAME=root \
            /bin/bash -p "$V2_STAGE/install-helper.sh"
          /usr/bin/sudo -n /bin/launchctl print "$HELPER_TARGET" >/dev/null
          /usr/bin/sudo -n "$HELPER_BIN" --health-probe

          /usr/bin/hdiutil detach "$MOUNT_DIR" >/dev/null
          MOUNTED=0
          /usr/bin/sudo -n /bin/rm -rf -- "$V2_STAGE"
          V2_STAGE=""

          echo "Upgrading the exact v2.1.5 app and helper state to v${WATTSON_VERSION}..."
          /usr/bin/sudo -n /usr/sbin/installer \
            -verboseR \
            -pkg "$PKG_PATH" \
            -target / \
            2>&1 | /usr/bin/tee -a "$RUNNER_TEMP/wattson-v2-upgrade.log"
          [[ ! -e "$LEGACY_APP" && ! -L "$LEGACY_APP" ]]
          [[ -d "$APP_DIR" && ! -L "$APP_DIR" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :ProgramArguments:2' "$LOGIN_PLIST")" == "/Applications/Wattson.app" ]]
          /bin/launchctl print "$LOGIN_TARGET" >/dev/null
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_DIR/Contents/Info.plist")" == "$WATTSON_VERSION" ]]
          /usr/bin/xcrun lipo "$APP_BIN" -verify_arch arm64 x86_64
          /usr/bin/xcrun lipo "$HELPER_BIN" -verify_arch arm64 x86_64
          /usr/bin/codesign --verify --deep --strict "$APP_DIR"
          /usr/bin/sudo -n /usr/bin/codesign --verify --strict "$HELPER_BIN"
          /usr/bin/sudo -n /bin/launchctl print "$HELPER_TARGET" >/dev/null
          /usr/bin/sudo -n "$HELPER_BIN" --health-probe
          [[ "$(/usr/sbin/pkgutil --pkg-info "$RECEIPT" | /usr/bin/awk -F': ' '$1 == "version" { print $2 }')" == "$WATTSON_VERSION" ]]
          echo "v2.1.5 upgrade and cleanup checks passed."

      - name: Upload installation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wattson-install-log-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wattson-*.log
          if-no-files-found: warn
          retention-days: 7
