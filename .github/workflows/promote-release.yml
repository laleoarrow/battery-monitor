name: Promote tested Wattson release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version without the v prefix
        required: true
        default: "3.0.6"
        type: string
      candidate_run_id:
        description: Successful Wattson release candidate workflow run ID
        required: true
        type: string
  workflow_run:
    workflows:
      - Wattson release candidate
    types:
      - completed

permissions:
  actions: write
  contents: write

concurrency:
  group: promote-stable-release
  cancel-in-progress: false

jobs:
  promote:
    name: Publish the exact tested artifact bytes
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      WATTSON_VERSION: ${{ inputs.version }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id || github.event.workflow_run.id }}
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve the automatic promotion inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$WATTSON_VERSION" ]]; then
            WATTSON_VERSION="$(tr -d '\r\n' < VERSION)"
          fi
          echo "WATTSON_VERSION=$WATTSON_VERSION" >> "$GITHUB_ENV"

      - name: Verify the successful candidate run identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$WATTSON_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$(tr -d '\r\n' < VERSION)" == "$WATTSON_VERSION" ]]

          readonly RUN_JSON="$RUNNER_TEMP/candidate-run.json"
          gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" \
            > "$RUN_JSON"
          RUN_EVENT="$(jq -r .event "$RUN_JSON")"
          readonly RUN_EVENT
          RUN_BRANCH="$(jq -r .head_branch "$RUN_JSON")"
          readonly RUN_BRANCH
          case "$RUN_EVENT:$RUN_BRANCH" in
            workflow_dispatch:main) ;;
            *) echo "candidate run did not originate from an approved release ref" >&2; exit 1 ;;
          esac
          [[ "$(jq -r .path "$RUN_JSON")" == ".github/workflows/macos-helper-install.yml" ]]
          [[ "$(jq -r .status "$RUN_JSON")" == "completed" ]]
          [[ "$(jq -r .conclusion "$RUN_JSON")" == "success" ]]
          [[ "$(jq -r .head_sha "$RUN_JSON")" == "$GITHUB_SHA" ]]

      - name: Require successful Headless CI on the same main commit
        shell: bash
        run: |
          set -euo pipefail
          readonly HEADLESS_JSON="$RUNNER_TEMP/headless-ci-runs.json"
          gh api \
            --method GET \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=completed \
            -f head_sha="$GITHUB_SHA" \
            -f per_page=10 \
            > "$HEADLESS_JSON"
          jq -e --arg sha "$GITHUB_SHA" '
            [
              .workflow_runs[]
              | select(
                  .head_sha == $sha and
                  .head_branch == "main" and
                  .event == "push" and
                  .status == "completed" and
                  .conclusion == "success"
                )
            ]
            | length >= 1
          ' "$HEADLESS_JSON" >/dev/null

      - name: Download the exact candidate artifact set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Wattson-release-candidate-v${{ env.WATTSON_VERSION }}
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}

      - name: Verify the release manifest and policy
        shell: bash
        run: |
          set -euo pipefail
          readonly PKG_NAME="Wattson-v${WATTSON_VERSION}-macos-universal.pkg"
          readonly DMG_NAME="Wattson-v${WATTSON_VERSION}-macos-universal.dmg"
          readonly INFO_NAME="Wattson-v${WATTSON_VERSION}-release-info.txt"
          readonly INFO_PATH="dist/$INFO_NAME"

          assert_metadata_line() {
            local expected="$1"
            [[ "$(awk -v expected="$expected" \
              '$0 == expected { count++ } END { print count + 0 }' "$INFO_PATH")" == "1" ]]
          }

          assert_metadata_key_once() {
            local expected_key="$1"
            [[ "$(awk -F= -v expected_key="$expected_key" \
              '$1 == expected_key { count++ } END { print count + 0 }' "$INFO_PATH")" == "1" ]]
          }

          for file_name in "$PKG_NAME" "$DMG_NAME" "$INFO_NAME" SHA256SUMS.txt; do
            [[ -f "dist/$file_name" && ! -L "dist/$file_name" ]]
          done
          [[ "$(wc -l < dist/SHA256SUMS.txt | tr -d ' ')" == "3" ]]
          (
            cd dist
            sha256sum -c SHA256SUMS.txt
          )
          assert_metadata_line "version=$WATTSON_VERSION"
          assert_metadata_line "architectures=arm64,x86_64"
          assert_metadata_line "minimum_macos=12.0"
          assert_metadata_line "install_path=/Applications/Wattson.app"
          for metadata_key in \
            distribution_mode \
            app_signature \
            helper_signature \
            package_signature \
            dmg_signature \
            notarized \
            stapled; do
            assert_metadata_key_once "$metadata_key"
          done
          assert_metadata_line "distribution_mode=developer-id"
          assert_metadata_line "app_signature=developer-id"
          assert_metadata_line "helper_signature=developer-id"
          assert_metadata_line "package_signature=developer-id"
          assert_metadata_line "dmg_signature=developer-id"
          assert_metadata_line "notarized=yes"
          assert_metadata_line "stapled=yes"

      - name: Create or verify the annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          readonly TAG="v$WATTSON_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            [[ "$(git rev-list -n 1 "$TAG")" == "$GITHUB_SHA" ]]
          else
            git tag -a "$TAG" -m "Wattson $TAG"
            git push origin "$TAG"
          fi

      - name: Publish the stable GitHub release
        shell: bash
        run: |
          set -euo pipefail
          readonly TAG="v$WATTSON_VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "stable release $TAG already exists; refusing to replace published assets" >&2
            exit 1
          fi
          NOTES_PATH="$RUNNER_TEMP/release-notes.md"
          readonly NOTES_PATH
          {
            printf '# Wattson v%s\n\n' "$WATTSON_VERSION"
            cat <<'EOF'
          This Wattson release is universal for Apple silicon and Intel and supports macOS 12 or later.

          - Rebuilds General and Modules Settings to match the approved C+E reference, while preserving every existing setting and its immediate synchronization with the menu-bar popover.
          - Uses a stable high-contrast dark palette at the reference size and proportionally scales the complete composition on constrained displays without changing its layout.
          - Lets General Settings switch Wattson's own status item between its original mark and a macOS-style battery glyph without changing Apple's separate system battery icon.
          - Adds glass refraction to the lifted power-mode selector with native Liquid Glass on macOS 26 and a cached optical AppKit fallback on macOS 12–25.
          - Hardens launch-at-login refreshes so every queued waiter completes across availability changes and stale in-flight writes.
          - Caches successfully parsed `pmset -g cap` capability results for the helper lifetime, while retrying failures and keeping live power-mode reads fresh.
          - Preserves keyboard and VoiceOver navigation, Reduce Motion, macOS 12–26 behavior, and universal Apple-silicon and Intel support.
          - Installs at `/Applications/Wattson.app` through one native PKG shared byte-for-byte by the DMG, with verified reinstall, v2 upgrade, helper replacement, uninstall, and SHA-256 metadata.

          **Verified distribution:** the app, helper, PKG, and DMG are Developer ID signed. Apple accepted both release containers for notarization, and their tickets are stapled for offline validation and normal Gatekeeper installation.
          EOF
          } > "$NOTES_PATH"
          gh release create "$TAG" \
            "dist/Wattson-v${WATTSON_VERSION}-macos-universal.pkg" \
            "dist/Wattson-v${WATTSON_VERSION}-macos-universal.dmg" \
            "dist/Wattson-v${WATTSON_VERSION}-release-info.txt" \
            "dist/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest=false \
            --title "Wattson v$WATTSON_VERSION" \
            --notes-file "$NOTES_PATH"

      - name: Dispatch Homebrew validation and synchronization
        shell: bash
        run: |
          set -euo pipefail
          readonly TAG="v$WATTSON_VERSION"
          gh workflow run homebrew-tap.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field "release_tag=$TAG"
