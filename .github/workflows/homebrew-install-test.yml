name: Test public Homebrew install

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable Wattson release tag
        required: true
        type: string
  push:
    branches:
      - 'homebrew-ready/v*'

permissions:
  actions: read
  contents: read

concurrency:
  group: homebrew-install-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify the public release and Homebrew recovery
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/homebrew-ready/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      tap_sha: ${{ steps.verify_public.outputs.tap_sha }}
      pkg_sha: ${{ steps.verify_public.outputs.pkg_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Resolve a recovery tag from the current main commit
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            workflow_dispatch:refs/heads/main)
              RELEASE_TAG="$REQUESTED_TAG"
              ;;
            push:refs/heads/homebrew-ready/v*)
              RELEASE_TAG="${GITHUB_REF#refs/heads/homebrew-ready/}"
              ;;
            *)
              echo "Unsupported Homebrew lifecycle trigger: $GITHUB_EVENT_NAME:$GITHUB_REF" >&2
              exit 1
              ;;
          esac
          readonly RELEASE_TAG
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          MAIN_SHA="$(
            gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              --jq .object.sha
          )"
          readonly MAIN_SHA
          [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$MAIN_SHA" ]] || {
            echo "Recovery branches must point at the current main commit." >&2
            exit 1
          }

          SOURCE_VERSION="$(
            /usr/bin/curl \
              --fail \
              --location \
              --proto '=https' \
              --retry 3 \
              --retry-delay 2 \
              --tlsv1.2 \
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/VERSION" \
              | /usr/bin/tr -d '\r\n'
          )"
          readonly SOURCE_VERSION
          [[ "$SOURCE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_TAG" == "v$SOURCE_VERSION" ]] || {
            echo "The recovery tag must match VERSION at the current main commit." >&2
            exit 1
          }

          readonly CI_RUNS="$RUNNER_TEMP/wattson-headless-ci.json"
          gh api \
            --method GET \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f head_sha="$GITHUB_SHA" \
            -f per_page=100 \
            > "$CI_RUNS"
          /usr/bin/jq -e --arg sha "$GITHUB_SHA" '
            any(
              .workflow_runs[];
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "push" and
              .status == "completed" and
              .conclusion == "success"
            )
          ' "$CI_RUNS" >/dev/null

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Require the exact tested public cask
        id: verify_public
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail

          readonly VERSION="${RELEASE_TAG#v}"
          readonly PKG_NAME="Wattson-v${VERSION}-macos-universal.pkg"
          readonly DMG_NAME="Wattson-v${VERSION}-macos-universal.dmg"
          readonly INFO_NAME="Wattson-v${VERSION}-release-info.txt"
          readonly CHECKSUM_NAME="SHA256SUMS.txt"
          readonly ASSET_BASE="https://github.com/laleoarrow/battery-monitor/releases/download/${RELEASE_TAG}"
          readonly DOWNLOAD_DIR="$RUNNER_TEMP/wattson-homebrew-recovery"
          readonly RELEASE_JSON="$RUNNER_TEMP/wattson-stable-release.json"

          gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RELEASE_JSON"
          [[ "$(/usr/bin/jq -r .tag_name "$RELEASE_JSON")" == "$RELEASE_TAG" ]]
          [[ "$(/usr/bin/jq -r .draft "$RELEASE_JSON")" == "false" ]]
          [[ "$(/usr/bin/jq -r .prerelease "$RELEASE_JSON")" == "false" ]]

          /bin/mkdir -p "$DOWNLOAD_DIR"
          for asset_name in "$PKG_NAME" "$DMG_NAME" "$INFO_NAME" "$CHECKSUM_NAME"; do
            /usr/bin/jq -e \
              --arg name "$asset_name" \
              '[.assets[] | select(.name == $name)] | length == 1' \
              "$RELEASE_JSON" >/dev/null
            /usr/bin/curl \
              --fail \
              --location \
              --proto '=https' \
              --retry 3 \
              --retry-delay 2 \
              --tlsv1.2 \
              --output "$DOWNLOAD_DIR/$asset_name" \
              "$ASSET_BASE/$asset_name"
          done
          [[ "$(/usr/bin/wc -l < "$DOWNLOAD_DIR/$CHECKSUM_NAME" | /usr/bin/tr -d ' ')" == "3" ]]
          (
            cd "$DOWNLOAD_DIR"
            /usr/bin/sha256sum -c "$CHECKSUM_NAME"
          )

          EXPECTED_SHA="$(
            /usr/bin/awk -v name="$PKG_NAME" '$2 == name { print $1 }' \
              "$DOWNLOAD_DIR/$CHECKSUM_NAME"
          )"
          readonly EXPECTED_SHA
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]]

          readonly TAP_REF="$RUNNER_TEMP/wattson-tap-main-ref.json"
          /usr/bin/curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 3 \
            --retry-delay 2 \
            --tlsv1.2 \
            --output "$TAP_REF" \
            'https://api.github.com/repos/laleoarrow/homebrew-tap/git/ref/heads/main'
          TAP_SHA="$(/usr/bin/jq -r '.object.sha // empty' "$TAP_REF")"
          readonly TAP_SHA
          [[ "$TAP_SHA" =~ ^[0-9a-f]{40}$ ]]

          readonly PUBLIC_CASK="$RUNNER_TEMP/wattson-public-cask.rb"
          /usr/bin/curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 3 \
            --retry-delay 2 \
            --tlsv1.2 \
            --output "$PUBLIC_CASK" \
            "https://raw.githubusercontent.com/laleoarrow/homebrew-tap/$TAP_SHA/Casks/wattson.rb"
          /usr/bin/grep -Fxq "  version \"$VERSION\"" "$PUBLIC_CASK"
          /usr/bin/grep -Fxq "  sha256 \"$EXPECTED_SHA\"" "$PUBLIC_CASK"
          ruby -c "$PUBLIC_CASK"

          readonly TAP_RUNS="$RUNNER_TEMP/wattson-tap-runs.json"
          /usr/bin/curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 3 \
            --retry-delay 2 \
            --tlsv1.2 \
            --output "$TAP_RUNS" \
            "https://api.github.com/repos/laleoarrow/homebrew-tap/actions/workflows/tests.yml/runs?event=push&head_sha=$TAP_SHA&per_page=10"
          /usr/bin/jq -e --arg sha "$TAP_SHA" '
            any(
              .workflow_runs[];
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "push" and
              .status == "completed" and
              .conclusion == "success"
            )
          ' "$TAP_RUNS" >/dev/null

          echo "tap_sha=$TAP_SHA" >> "$GITHUB_OUTPUT"
          echo "pkg_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

  install:
    name: Homebrew lifecycle on ${{ matrix.runner }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-26
            architecture: arm64
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      EXPECTED_TAP_SHA: ${{ needs.prepare.outputs.tap_sha }}
      EXPECTED_PKG_SHA: ${{ needs.prepare.outputs.pkg_sha }}
      EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - name: Validate the hosted runner and stable release
        shell: bash
        run: |
          set -euo pipefail

          [[ "${GITHUB_ACTIONS:-}" == "true" ]]
          [[ "${RUNNER_OS:-}" == "macOS" ]]
          [[ "${RUNNER_ENVIRONMENT:-}" == "github-hosted" ]]
          [[ "$(/usr/bin/uname -m)" == "$EXPECTED_ARCHITECTURE" ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          /usr/bin/sudo -n /usr/bin/true
          /usr/bin/command -v brew >/dev/null

          AWS_TAP_DIR="$(brew --repository)/Library/Taps/aws/homebrew-tap"
          readonly AWS_TAP_DIR
          if [[ -d "$AWS_TAP_DIR" ]]; then
            [[ ! -L "$AWS_TAP_DIR" ]]
            brew untap --force aws/tap
          fi

          readonly VERSION="${RELEASE_TAG#v}"
          readonly PKG_NAME="Wattson-v${VERSION}-macos-universal.pkg"
          readonly RELEASE_JSON="$RUNNER_TEMP/wattson-stable-release.json"
          readonly TAG_JSON="$RUNNER_TEMP/wattson-stable-tag.json"

          gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RELEASE_JSON"
          [[ "$(/usr/bin/jq -r .tag_name "$RELEASE_JSON")" == "$RELEASE_TAG" ]]
          [[ "$(/usr/bin/jq -r .draft "$RELEASE_JSON")" == "false" ]]
          [[ "$(/usr/bin/jq -r .prerelease "$RELEASE_JSON")" == "false" ]]
          /usr/bin/jq -e \
            --arg name "$PKG_NAME" \
            '[.assets[] | select(.name == $name)] | length == 1' \
            "$RELEASE_JSON" >/dev/null

          gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            > "$TAG_JSON"
          [[ "$(/usr/bin/jq -r .ref "$TAG_JSON")" == "refs/tags/$RELEASE_TAG" ]]

          echo "WATTSON_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate the public Homebrew cask
        shell: bash
        run: |
          set -euo pipefail

          readonly CASK_JSON="$RUNNER_TEMP/wattson-public-cask.json"
          readonly EXPECTED_URL="https://github.com/laleoarrow/battery-monitor/releases/download/${RELEASE_TAG}/Wattson-v${WATTSON_VERSION}-macos-universal.pkg"
          [[ "$EXPECTED_TAP_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_PKG_SHA" =~ ^[0-9a-f]{64}$ ]]

          brew tap laleoarrow/tap
          TAP_REPOSITORY="$(brew --repository laleoarrow/tap)"
          readonly TAP_REPOSITORY
          [[ -d "$TAP_REPOSITORY/.git" ]]
          [[ -f "$TAP_REPOSITORY/Casks/wattson.rb" ]]
          [[ ! -L "$TAP_REPOSITORY/Casks/wattson.rb" ]]
          CURRENT_TAP_SHA="$(git -C "$TAP_REPOSITORY" rev-parse HEAD)"
          readonly CURRENT_TAP_SHA
          [[ "$CURRENT_TAP_SHA" == "$EXPECTED_TAP_SHA" ]]
          /usr/bin/grep -Fxq "  version \"$WATTSON_VERSION\"" \
            "$TAP_REPOSITORY/Casks/wattson.rb"
          /usr/bin/grep -Fxq "  sha256 \"$EXPECTED_PKG_SHA\"" \
            "$TAP_REPOSITORY/Casks/wattson.rb"
          brew info --cask --json=v2 laleoarrow/tap/wattson > "$CASK_JSON"
          [[ "$(/usr/bin/jq -r '.casks | length' "$CASK_JSON")" == "1" ]]
          [[ "$(/usr/bin/jq -r '.casks[0].token' "$CASK_JSON")" == "wattson" ]]
          [[ "$(/usr/bin/jq -r '.casks[0].version' "$CASK_JSON")" == "$WATTSON_VERSION" ]]
          [[ "$(/usr/bin/jq -r '.casks[0].sha256' "$CASK_JSON")" == "$EXPECTED_PKG_SHA" ]]
          [[ "$(/usr/bin/jq -r '.casks[0].url' "$CASK_JSON")" == "$EXPECTED_URL" ]]

      - name: Test public cask install and uninstall
        shell: bash
        run: |
          set -euo pipefail

          readonly APP_DIR="/Applications/Wattson.app"
          readonly APP_BIN="$APP_DIR/Contents/MacOS/Wattson"
          readonly HELPER_LABEL="com.leoarrow.wattson.helper"
          readonly HELPER_TARGET="system/$HELPER_LABEL"
          readonly HELPER_BIN="/Library/PrivilegedHelperTools/$HELPER_LABEL"
          readonly HELPER_PLIST="/Library/LaunchDaemons/$HELPER_LABEL.plist"
          readonly HELPER_SOCKET="/var/run/wattson-helper.sock"
          readonly RECEIPT="com.leoarrow.wattson.pkg"
          readonly LOGIN_LABEL="com.leoarrow.wattson.login"
          LOGIN_TARGET="gui/$(/usr/bin/id -u)/$LOGIN_LABEL"
          readonly LOGIN_TARGET
          readonly LOGIN_PLIST="$HOME/Library/LaunchAgents/$LOGIN_LABEL.plist"
          CLEANUP_REQUIRED=0

          fail() {
            echo "Homebrew lifecycle test: $*" >&2
            exit 1
          }

          probe_helper_service() {
            local output
            if output="$(
              /usr/bin/sudo -n /usr/bin/env -i \
                PATH=/usr/bin:/bin:/usr/sbin:/sbin \
                LANG=C \
                LC_ALL=C \
                /bin/launchctl print "$HELPER_TARGET" 2>&1
            )"; then
              return 0
            fi
            case "$output" in
              *"Could not find service"*|*"Could not find specified service"*) return 1 ;;
              *) echo "Unexpected launchd query failure: $output" >&2; return 2 ;;
            esac
          }

          assert_helper_absent() {
            local status
            if probe_helper_service; then
              fail "helper service remains registered"
            else
              status="$?"
            fi
            [[ "$status" == "1" ]] || fail "could not confirm helper service removal"
          }

          assert_login_agent_absent() {
            local output
            local status
            if output="$(/bin/launchctl print "$LOGIN_TARGET" 2>&1)"; then
              fail "login agent remains registered"
            else
              status="$?"
            fi
            case "$output" in
              *"Could not find service"*|*"Could not find specified service"*) ;;
              *) fail "could not confirm login agent removal (status=$status): $output" ;;
            esac
          }

          assert_helper_enabled() {
            local disabled_state
            disabled_state="$(/usr/bin/sudo -n /bin/launchctl print-disabled system)"
            case "$disabled_state" in
              *"\"$HELPER_LABEL\" => disabled"*|*"\"$HELPER_LABEL\" => true"*)
                fail "helper service is disabled"
                ;;
            esac
          }

          assert_quarantine_absent() {
            local attributes
            attributes="$(/usr/bin/sudo -n /usr/bin/xattr "$1")"
            case $'\n'"$attributes"$'\n' in
              *$'\ncom.apple.quarantine\n'*) fail "installed item retains quarantine: $1" ;;
            esac
          }

          collect_diagnostics() {
            echo "::group::Wattson Homebrew diagnostics"
            brew config || true
            brew info --cask laleoarrow/tap/wattson || true
            brew list --cask --versions wattson || true
            /usr/bin/sudo -n /bin/launchctl print "$HELPER_TARGET" || true
            /usr/bin/sudo -n /bin/launchctl print-disabled system || true
            /usr/bin/sudo -n /usr/bin/xattr "$HELPER_BIN" || true
            /usr/bin/sudo -n /usr/bin/xattr "$HELPER_PLIST" || true
            /usr/bin/sudo -n /usr/bin/tail -n 500 /var/log/install.log || true
            /usr/bin/log show --style compact --last 10m \
              --predicate '(process == "wattson-helper") OR (eventMessage CONTAINS[c] "Wattson")' \
              || true
            echo "::endgroup::"
          }

          cleanup() {
            local status="$?"
            trap - EXIT
            set +e
            if [[ "$status" != "0" ]]; then
              collect_diagnostics
            fi
            if [[ "$CLEANUP_REQUIRED" == "1" ]]; then
              brew uninstall --cask --force laleoarrow/tap/wattson >/dev/null 2>&1 || true
              /bin/launchctl bootout "$LOGIN_TARGET" >/dev/null 2>&1 || true
              /bin/rm -f -- "$LOGIN_PLIST"
              /usr/bin/sudo -n /bin/launchctl bootout "$HELPER_TARGET" >/dev/null 2>&1 || true
              /usr/bin/sudo -n /bin/launchctl enable "$HELPER_TARGET" >/dev/null 2>&1 || true
              /usr/bin/sudo -n /bin/rm -f -- "$HELPER_SOCKET" "$HELPER_PLIST" "$HELPER_BIN"
              /usr/bin/sudo -n /bin/rm -rf -- "$APP_DIR"
              /usr/bin/sudo -n /usr/sbin/pkgutil --forget "$RECEIPT" >/dev/null 2>&1 || true
            fi
            exit "$status"
          }
          trap cleanup EXIT

          [[ "${GITHUB_ACTIONS:-}" == "true" ]] || fail "GitHub Actions is required"
          [[ "${RUNNER_OS:-}" == "macOS" ]] || fail "a macOS runner is required"
          [[ "${RUNNER_ENVIRONMENT:-}" == "github-hosted" ]] \
            || fail "a GitHub-hosted ephemeral runner is required"
          [[ "$(/usr/bin/uname -m)" == "$EXPECTED_ARCHITECTURE" ]] \
            || fail "runner architecture does not match the matrix"
          /usr/bin/sudo -n /usr/bin/true

          for initial_path in \
            "$APP_DIR" "$HELPER_BIN" "$HELPER_PLIST" "$HELPER_SOCKET" "$LOGIN_PLIST"; do
            [[ ! -e "$initial_path" && ! -L "$initial_path" ]] \
              || fail "refusing to touch pre-existing path: $initial_path"
          done
          if /usr/sbin/pkgutil --pkg-info "$RECEIPT" >/dev/null 2>&1; then
            fail "fresh runner unexpectedly has a Wattson package receipt"
          fi
          assert_helper_absent
          assert_login_agent_absent
          assert_helper_enabled

          CLEANUP_REQUIRED=1
          brew install --cask laleoarrow/tap/wattson

          [[ -d "$APP_DIR" && ! -L "$APP_DIR" ]] || fail "app was not installed"
          [[ -f "$APP_BIN" && ! -L "$APP_BIN" ]] || fail "app executable is missing"
          [[ -f "$HELPER_BIN" && ! -L "$HELPER_BIN" ]] || fail "helper is missing"
          [[ -f "$HELPER_PLIST" && ! -L "$HELPER_PLIST" ]] || fail "helper plist is missing"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_DIR/Contents/Info.plist")" == "com.leoarrow.wattson" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_DIR/Contents/Info.plist")" == "$WATTSON_VERSION" ]]
          [[ "$(/usr/bin/sudo -n /usr/bin/stat -f '%u:%g:%OLp' "$HELPER_BIN")" == "0:0:544" ]]
          [[ "$(/usr/bin/sudo -n /usr/bin/stat -f '%u:%g:%OLp' "$HELPER_PLIST")" == "0:0:644" ]]
          /usr/bin/xcrun lipo "$APP_BIN" -verify_arch arm64 x86_64
          /usr/bin/xcrun lipo "$HELPER_BIN" -verify_arch arm64 x86_64
          /usr/bin/sudo -n /bin/launchctl print "$HELPER_TARGET" >/dev/null
          /usr/bin/sudo -n "$HELPER_BIN" --health-probe
          assert_helper_enabled
          assert_quarantine_absent "$HELPER_BIN"
          assert_quarantine_absent "$HELPER_PLIST"
          [[ "$(/usr/sbin/pkgutil --pkg-info "$RECEIPT" | /usr/bin/awk -F': ' '$1 == "version" { print $2 }')" == "$WATTSON_VERSION" ]]
          [[ "$(brew list --cask --versions wattson)" == "wattson $WATTSON_VERSION" ]]

          brew uninstall --cask laleoarrow/tap/wattson

          for removed_path in \
            "$APP_DIR" "$HELPER_BIN" "$HELPER_PLIST" "$HELPER_SOCKET" "$LOGIN_PLIST"; do
            [[ ! -e "$removed_path" && ! -L "$removed_path" ]] \
              || fail "Homebrew uninstall left $removed_path"
          done
          if /usr/sbin/pkgutil --pkg-info "$RECEIPT" >/dev/null 2>&1; then
            fail "Homebrew uninstall left the package receipt"
          fi
          if brew list --cask --versions wattson >/dev/null 2>&1; then
            fail "Homebrew still reports Wattson as installed"
          fi
          assert_helper_absent
          assert_login_agent_absent
          assert_helper_enabled

          CLEANUP_REQUIRED=0
          echo "Public Homebrew cask install, helper health, and uninstall cleanup passed."

  deploy-pages:
    name: Deploy site after both public cask lifecycles pass
    needs: [prepare, install]
    if: success()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Mark the fully validated stable release as latest
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          RELEASE_ID="$(
            gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              --jq .id
          )"
          readonly RELEASE_ID
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          gh api \
            --method PATCH \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f make_latest=true \
            >/dev/null

          latest_matches=0
          for attempt in {1..12}; do
            if [[ "$(
              gh api \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/$GITHUB_REPOSITORY/releases/latest" \
                --jq .tag_name
            )" == "$RELEASE_TAG" ]]; then
              latest_matches=1
              break
            fi
            echo "latest-release verification poll $attempt/12"
            /bin/sleep 5
          done
          [[ "$latest_matches" == "1" ]]

      - name: Dispatch the stable-release Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh workflow run pages.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field "release_tag=$RELEASE_TAG"
