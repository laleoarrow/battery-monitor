name: Headless CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headless-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: SwiftPM and Python tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Swift package
        run: swift build

      - name: Test Swift package
        run: swift test

      - name: Run the default headless Python suite
        shell: bash
        run: env -u WATTSON_RUN_INTERACTION /usr/bin/python3 -m unittest discover -s tests -v

  website:
    name: Website build, test, lint, and export
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install locked website dependencies
        working-directory: website
        run: npm ci

      - name: Build and test the rendered website
        working-directory: website
        run: npm test

      - name: Lint the website
        working-directory: website
        run: npm run lint

      - name: Export the GitHub Pages site
        working-directory: website
        run: npm run export:pages
