<style>
#wattson-full-charge { --fc-surface:light-dark(#f5f5f7,#1c1c1e); --fc-ink:light-dark(#333338,#d1d1d6); --fc-muted:light-dark(#66666e,#a1a1a7); --fc-line:light-dark(#dcdce1,#323236); --fc-well:light-dark(#e9e9ee,#29292e); --fc-accent:light-dark(#0875df,#0a84ff); --fc-bright:color-mix(in srgb,var(--fc-accent),white 72%); --fc-deep:color-mix(in srgb,var(--fc-accent),black 24%); font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--fc-ink); }
#wattson-full-charge * { box-sizing:border-box; }
#wattson-full-charge[data-palette="green"] { --fc-accent:light-dark(#238241,#30d158); }
#wattson-full-charge[data-palette="amber"] { --fc-accent:light-dark(#b46b05,#ffad39); }
#wattson-full-charge[data-palette="violet"] { --fc-accent:light-dark(#8753d2,#b58afa); }
#wattson-full-charge[data-palette="neutral"] { --fc-accent:light-dark(#60606e,#bfc1ca); }
#wattson-full-charge .fc-heading { padding:6px 98px 16px 0; font-size:14px; font-weight:500; min-height:50px; }
#wattson-full-charge .fc-options { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }
#wattson-full-charge button,#wattson-full-charge select { font:inherit; color:var(--fc-ink); background:var(--fc-surface); border:1px solid var(--fc-line); border-radius:8px; padding:7px 12px; }
#wattson-full-charge button[aria-pressed="true"] { background:var(--fc-well); border-color:var(--fc-muted); }
#wattson-full-charge .fc-appearance { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-left:auto; color:var(--fc-muted); }
#wattson-full-charge .fc-stage { padding:28px 18px 24px; display:flex; justify-content:center; align-items:center; gap:40px; min-height:275px; }
#wattson-full-charge .fc-context { width:350px; max-width:100%; flex-shrink:0; }
#wattson-full-charge .fc-label { text-align:center; font-size:12px; color:var(--fc-muted); margin-bottom:14px; }
#wattson-full-charge .fc-window { background:var(--fc-surface); border:1px solid var(--fc-line); border-radius:16px; padding:16px; box-shadow:0 8px 24px light-dark(#11111b0c,#0000001f); }
#wattson-full-charge .fc-row { display:flex; align-items:center; min-height:88px; gap:12px; border-top:1px solid var(--fc-line); border-bottom:1px solid var(--fc-line); }
#wattson-full-charge .fc-clock { width:44px; height:44px; flex-shrink:0; border-radius:12px; display:grid; place-items:center; position:relative; background:var(--fc-well); border:1px solid color-mix(in srgb,var(--fc-accent) 25%,var(--fc-line)); color:light-dark(#777783,#c0c1ca); }
#wattson-full-charge .fc-clock::before { content:""; position:absolute; width:22px; height:22px; border-radius:50%; background:linear-gradient(135deg,color-mix(in srgb,var(--fc-accent) 10%,transparent),color-mix(in srgb,var(--fc-accent) 32%,transparent)); }
#wattson-full-charge .fc-clock svg { position:relative; width:27px !important; height:27px !important; stroke-width:1.25; }
#wattson-full-charge .fc-clock svg :is(path,polyline,line) { stroke:var(--fc-accent); stroke-width:1.8; }
#wattson-full-charge .fc-copy { flex:1; min-width:0; text-align:right; }
#wattson-full-charge .fc-caption { display:flex; justify-content:flex-end; align-items:center; gap:4px; font-size:11.5px; color:var(--fc-muted); white-space:nowrap; }
#wattson-full-charge .fc-value { font-size:20px; line-height:29px; color:var(--fc-ink); font-weight:400; white-space:nowrap; }
#wattson-full-charge .fc-detail { width:154px; flex-shrink:0; }
#wattson-full-charge .fc-magnifier { display:grid; place-items:center; height:152px; background:var(--fc-surface); border:1px solid var(--fc-line); border-radius:22px; }
#wattson-full-charge .fc-magnifier .fc-badge { transform:scale(5); }
#wattson-full-charge .fc-badge { position:relative; display:inline-block; width:24px; height:24px; flex-shrink:0; isolation:isolate; }
#wattson-full-charge .fc-canvas { display:block; width:24px; height:24px; }
#wattson-full-charge .fc-color { position:absolute; width:0; height:0; overflow:hidden; }
#wattson-full-charge .fc-color[data-color="accent"] { color:var(--fc-accent); }
#wattson-full-charge .fc-color[data-color="bright"] { color:var(--fc-bright); }
#wattson-full-charge .fc-color[data-color="deep"] { color:var(--fc-deep); }
#wattson-full-charge .fc-status { font-size:12px; color:var(--fc-muted); text-align:center; margin-top:12px; min-height:36px; }
@media(max-width:620px) { #wattson-full-charge .fc-stage { flex-direction:column; gap:26px; padding:24px 10px; } #wattson-full-charge .fc-appearance { margin-left:0; } #wattson-full-charge .fc-window { padding:12px; } #wattson-full-charge .fc-row { gap:8px; } }
@media(pointer:coarse) { #wattson-full-charge button,#wattson-full-charge select { min-height:44px; } }
</style>
<div id="wattson-full-charge" data-state="full" data-palette="blue" aria-label="Wattson 满电双星轨设计稿">
  <div class="fc-heading">满电 · 立体双星轨</div>
  <span class="fc-color" data-color="accent" aria-hidden="true"></span><span class="fc-color" data-color="bright" aria-hidden="true"></span><span class="fc-color" data-color="deep" aria-hidden="true"></span>
  <div class="fc-options">
    <button class="cursor-interaction" type="button" data-state="full" aria-pressed="true">满电 · 新增</button>
    <button class="cursor-interaction" type="button" data-state="calculating" aria-pressed="false">计算中 · 对照</button>
    <label class="fc-appearance">外观 <select aria-label="预览外观"><option value="auto">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
  </div>
  <div class="fc-stage viz-dotted-background">
    <div class="fc-context">
      <div class="fc-label">实际大小 · 时间栏目</div>
      <div class="fc-window"><div class="fc-row">
        <div class="fc-clock"><i data-lucide="clock-3" aria-hidden="true"></i></div>
        <div class="fc-copy">
          <div class="fc-caption"><span class="fc-badge" aria-hidden="true"><canvas class="fc-canvas"></canvas></span><span>Estimated Time to Full</span></div>
          <div class="fc-value">Fully Charged</div>
        </div>
      </div></div>
    </div>
    <div class="fc-detail"><div class="fc-label">前后遮挡 · 放大 5 倍</div><div class="fc-magnifier"><span class="fc-badge" role="img" aria-label="双星沿立体斜轨绕行，前侧经过球面，后侧被球体遮住"><canvas class="fc-canvas"></canvas></span></div></div>
  </div>
  <div class="fc-status" aria-live="polite">前侧掠过球面 · 后侧自然遮挡 · 双星慢速错行</div>
</div>
<script>
(() => {
  const root=document.getElementById('wattson-full-charge');
  const ui={state:'full',appearance:'auto',palette:'blue',speed:1,drift:1,ring:true};
  const reduced=matchMedia('(prefers-reduced-motion:reduce)');
  const scenes=[...root.querySelectorAll('.fc-canvas')].map(canvas=>({canvas,ctx:canvas.getContext('2d')}));
  let colors={};
  let time=0,last=null,raf=0,inView=true;
  function orbitAngle(t,orbit){
    const direction=orbit===0?1:-1,period=orbit===0?8:10.6,omega=2*Math.PI/period;
    const wave=orbit===0?.29:.21,offset=orbit===0?.4:2.1;
    const phase=orbit===0?Math.PI-.35:1.45;
    return phase+direction*(omega*t+.06*ui.drift*omega/wave*(Math.sin(wave*t+offset)-Math.sin(offset)));
  }
  function project(t,orbit,angle=orbitAngle(t,orbit)){
    const inclination=((orbit===0?78:76)+.8*ui.drift*Math.sin(t*.13+orbit))*Math.PI/180;
    const roll=((orbit===0?35:-32)+1.4*ui.drift*Math.sin(t*.17+orbit*2.2))*Math.PI/180;
    const radius=orbit===0?8.4:7.4;
    const x=radius*Math.cos(angle),y=radius*Math.sin(angle)*Math.cos(inclination),z=radius*Math.sin(angle)*Math.sin(inclination);
    const scale=70/(70-z);
    return {x:(x*Math.cos(roll)-y*Math.sin(roll))*scale,y:(x*Math.sin(roll)+y*Math.cos(roll))*scale,z,scale};
  }
  function geometry(t){
    const commands=[],full=ui.state==='full',cycle=((t%3.3)+3.3)%3.3;
    const addLine=(a,b,width,alpha,color)=>{
      if(a.z*b.z<0){
        const f=-a.z/(b.z-a.z),mid={x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f,z:0,scale:a.scale+(b.scale-a.scale)*f};
        addLine(a,mid,width,alpha,color);addLine(mid,b,width,alpha,color);return;
      }
      commands.push({type:'line',a,b,z:(a.z+b.z)/2,width,alpha,color});
    };
    for(let orbit=0;orbit<(full?2:1);orbit++){
      if(full&&ui.ring){for(let i=0;i<128;i++){
        const a=project(t,orbit,i/128*2*Math.PI),b=project(t,orbit,(i+1)/128*2*Math.PI);
        addLine(a,b,.12,.2,a.z+b.z>=0?'bright':'accent');
      }}
      const alpha=full?1:reduced.matches||cycle>=2.8?0:Math.max(0,Math.min(1,cycle/.2,(2.8-cycle)/.25));
      if(!alpha)continue;
      const at=dt=>full?project(t-dt,orbit):project(t-dt,orbit,(cycle-dt)/2.8*2*Math.PI);
      if(!reduced.matches){for(let i=28;i>0;i--){
        const fraction=1-(i-.5)/28,a=at(i*.52/28),b=at((i-1)*.52/28);
        addLine(a,b,(.07+.48*fraction*fraction)*(a.scale+b.scale)/2,alpha*.72*Math.pow(fraction,.8),'bright');
      }}
      const head=at(0);commands.push({type:'head',...head,radius:(orbit===0?.58:.5)*head.scale,alpha});
    }
    return commands.sort((a,b)=>a.z-b.z);
  }
  function paintCommand(ctx,c){
    const depth=Math.max(0,Math.min(1,(c.z+9)/18));
    ctx.globalAlpha=c.alpha*(.42+.58*depth);ctx.lineCap='round';
    if(c.type==='line'){ctx.strokeStyle=colors[c.color];ctx.lineWidth=c.width;ctx.beginPath();ctx.moveTo(c.a.x,c.a.y);ctx.lineTo(c.b.x,c.b.y);ctx.stroke();}
    else{
      ctx.save();ctx.globalAlpha*=.26;
      const glow=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,c.radius*2.5);
      glow.addColorStop(0,colors.accent);glow.addColorStop(1,'transparent');ctx.fillStyle=glow;
      ctx.beginPath();ctx.arc(c.x,c.y,c.radius*2.5,0,Math.PI*2);ctx.fill();ctx.restore();
      ctx.fillStyle=colors.bright;ctx.beginPath();ctx.arc(c.x,c.y,c.radius,0,Math.PI*2);ctx.fill();
    }
  }
  function draw(){
    const t=reduced.matches?0:time*ui.speed,commands=geometry(t),cycle=t%3.3;
    const pulse=ui.state==='full'||reduced.matches?1:.52+.48*Math.sin(Math.PI*Math.min(cycle/2.8,1))**2;
    for(const {canvas,ctx} of scenes){
      const pixels=Math.ceil(canvas.getBoundingClientRect().width*Math.max(2,devicePixelRatio));
      if(canvas.width!==pixels){canvas.width=canvas.height=pixels;}
      ctx.setTransform(pixels/24,0,0,pixels/24,pixels/2,pixels/2);ctx.clearRect(-12,-12,24,24);
      ctx.globalAlpha=.16*pulse;
      const halo=ctx.createRadialGradient(0,0,2,0,0,7.5);halo.addColorStop(0,colors.accent);halo.addColorStop(1,'transparent');ctx.fillStyle=halo;
      ctx.beginPath();ctx.arc(0,0,7.5,0,Math.PI*2);ctx.fill();
      commands.filter(c=>c.z<0).forEach(c=>paintCommand(ctx,c));
      ctx.globalAlpha=1;
      const sphere=ctx.createRadialGradient(-1.45,-1.65,.1,-.2,-.15,4.4);
      sphere.addColorStop(0,colors.bright);sphere.addColorStop(.43,colors.accent);sphere.addColorStop(1,colors.deep);
      ctx.fillStyle=sphere;ctx.filter=`brightness(${pulse})`;ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();ctx.filter='none';
      commands.filter(c=>c.z>=0).forEach(c=>paintCommand(ctx,c));ctx.globalAlpha=1;
    }
  }
  function tick(now){raf=0;if(last!==null)time+=(now-last)/1000;last=now;draw();schedule();}
  function schedule(){if(!raf&&!document.hidden&&inView&&!reduced.matches)raf=requestAnimationFrame(tick);}
  function visibility(){cancelAnimationFrame(raf);raf=0;last=null;draw();schedule();}
  function render(){
    root.dataset.state=ui.state;root.dataset.palette=ui.palette;root.style.colorScheme=ui.appearance==='auto'?'':ui.appearance;
    root.querySelector('select').value=ui.appearance;
    root.querySelectorAll('button[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===ui.state)));
    root.querySelector('.fc-value').textContent=ui.state==='full'?'Fully Charged':'Calculating…';
    root.querySelector('.fc-status').textContent=reduced.matches?'减少动态效果 · 静态星轨':ui.state==='full'?'前侧掠过球面 · 后侧自然遮挡 · 双星慢速错行':'单星绕行 · 同步呼吸 · 圈末停 0.5 秒';
    root.querySelector('.fc-magnifier .fc-badge').setAttribute('aria-label',ui.state==='full'?'双星沿立体斜轨绕行，前侧经过球面，后侧被球体遮住':'单颗星点与中心呼吸同步，绕行一圈后停半秒');
    colors=Object.fromEntries([...root.querySelectorAll('.fc-color')].map(node=>[node.dataset.color,getComputedStyle(node).color]));
    draw();schedule();
  }
  function save(){window.openai?.setWidgetState?.({modelContent:{design:'满电立体双星轨',revision:2,state:ui.state,palette:ui.palette,speed:ui.speed,drift:ui.drift},privateContent:{...ui,revision:2}}).catch(()=>{});}
  function restore(saved){const s=saved?.privateContent;if(s){if(s.revision===2&&['full','calculating'].includes(s.state))ui.state=s.state;if(['auto','light','dark'].includes(s.appearance))ui.appearance=s.appearance;if(['blue','green','amber','violet','neutral'].includes(s.palette))ui.palette=s.palette;if(typeof s.speed==='number')ui.speed=Math.min(1.3,Math.max(.7,s.speed));if(typeof s.drift==='number')ui.drift=Math.min(1.5,Math.max(0,s.drift));if(s.revision===2&&typeof s.ring==='boolean')ui.ring=s.ring;}render();}
  root.querySelectorAll('button[data-state]').forEach(b=>b.addEventListener('click',()=>{ui.state=b.dataset.state;time=0;last=null;render();save();}));
  root.querySelector('select').addEventListener('change',event=>{ui.appearance=event.target.value;render();save();});
  document.addEventListener('visibilitychange',visibility);
  reduced.addEventListener('change',()=>{visibility();render();});
  matchMedia('(prefers-color-scheme:dark)').addEventListener('change',render);
  const observer=new IntersectionObserver(entries=>{inView=entries.some(e=>e.isIntersecting);visibility();});observer.observe(root);
  window.addEventListener('pagehide',()=>{cancelAnimationFrame(raf);observer.disconnect();});
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState);});
  restore(window.openai?.widgetState);
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();save();}});tweak.addSelect(ui,'palette',{label:'仪表配色预览',options:[{label:'蓝色',value:'blue'},{label:'绿色',value:'green'},{label:'琥珀',value:'amber'},{label:'紫色',value:'violet'},{label:'银灰',value:'neutral'}]});tweak.addSlider(ui,'speed',{label:'绕行速度',min:.7,max:1.3,step:.1});tweak.addSlider(ui,'drift',{label:'自然错落',min:0,max:1.5,step:.1});tweak.addToggle(ui,'ring',{label:'微光轨道线'});}
})();
</script>
