<style>
#wattson-planet-draft { --wp-surface:light-dark(#f6f6f8,#242428); --wp-ink:light-dark(#222228,#f2f2f7); --wp-muted:light-dark(#65656d,#aaaab4); --wp-line:light-dark(#d5d5dc,#414149); --wp-well:light-dark(#e5e5eb,#303036); --wp-accent:light-dark(#0064cf,#0a84ff); --wp-bright:light-dark(#acd4ff,#b1dbff); --wp-deep:light-dark(#0052aa,#086bd1); --wp-red:light-dark(#c72528,#ff453a); --wp-glow:.3; font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--wp-ink); }
#wattson-planet-draft * { box-sizing:border-box; }
#wattson-planet-draft .wp-top { display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; align-items:center; padding:8px 100px 14px 0; }
#wattson-planet-draft .wp-themes { display:flex; gap:4px; }
#wattson-planet-draft button { font:inherit; border:1px solid var(--wp-line); background:var(--wp-surface); color:var(--wp-muted); border-radius:8px; padding:6px 12px; }
#wattson-planet-draft button[aria-pressed="true"] { color:var(--wp-ink); border-color:var(--wp-muted); background:var(--wp-well); }
#wattson-planet-draft .wp-states { display:flex; gap:7px; flex-wrap:wrap; padding-bottom:18px; }
#wattson-planet-draft .wp-states button { flex:1; min-width:100px; }
#wattson-planet-draft .wp-stage { min-height:300px; padding:26px 20px 38px; display:flex; align-items:center; justify-content:center; gap:42px; }
#wattson-planet-draft .wp-context { width:360px; max-width:100%; flex-shrink:0; }
#wattson-planet-draft .wp-label { color:var(--wp-muted); font-size:12px; margin-bottom:14px; text-align:center; }
#wattson-planet-draft .wp-window { background:var(--wp-surface); border:1px solid var(--wp-line); border-radius:17px; padding:12px 16px; box-shadow:0 10px 28px light-dark(#24242a14,#00000030); }
#wattson-planet-draft .wp-runtime { height:88px; display:flex; align-items:center; gap:12px; padding:0 12px; }
#wattson-planet-draft .wp-clock { width:44px; height:44px; flex-shrink:0; border-radius:11px; background:var(--wp-well); border:1px solid var(--wp-line); position:relative; display:grid; place-items:center; color:var(--wp-muted); }
#wattson-planet-draft .wp-clock svg { width:24px; height:24px; }
#wattson-planet-draft .wp-copy { flex:1; min-width:0; text-align:right; }
#wattson-planet-draft .wp-caption { display:flex; align-items:center; justify-content:flex-end; white-space:nowrap; gap:4px; color:var(--wp-muted); font-size:11.5px; height:20px; }
#wattson-planet-draft .wp-value { font-size:24px; line-height:31px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
#wattson-planet-draft[data-state="calculating"] .wp-value, #wattson-planet-draft[data-state="unavailable"] .wp-value { font-size:16px; font-weight:400; color:var(--wp-muted); }
#wattson-planet-draft .wp-badge { width:20px; height:20px; flex-shrink:0; position:relative; display:inline-block; isolation:isolate; }
#wattson-planet-draft .wp-halo { position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb,var(--wp-accent) 30%,transparent),color-mix(in srgb,var(--wp-accent) 13%,transparent) 35%,transparent 72%); opacity:var(--wp-glow); }
#wattson-planet-draft .wp-planet { position:absolute; width:8px; height:8px; left:6px; top:6px; border-radius:50%; background:radial-gradient(circle at 30% 25%,var(--wp-bright),var(--wp-accent) 48%,var(--wp-deep)); }
#wattson-planet-draft .wp-particle { position:absolute; border-radius:50%; background:var(--wp-bright); opacity:0; left:10px; top:10px; }
#wattson-planet-draft .wp-detail { width:140px; flex-shrink:0; text-align:center; }
#wattson-planet-draft .wp-enlarged { height:120px; display:grid; place-items:center; }
#wattson-planet-draft .wp-enlarged .wp-badge { transform:scale(4); }
#wattson-planet-draft .wp-corner .wp-clock .wp-badge { position:absolute; right:-4px; bottom:-4px; }
#wattson-planet-draft .wp-statusline { color:var(--wp-muted); font-size:12px; text-align:center; min-height:38px; padding:8px 16px; }
#wattson-planet-draft[data-state="fallback"] .wp-planet { animation:wp-breathe 3.6s ease-in-out infinite; }
#wattson-planet-draft[data-state="calculating"] .wp-planet { animation:wp-breathe 1.8s ease-in-out infinite; }
#wattson-planet-draft[data-state="unavailable"] { --wp-accent:var(--wp-red); --wp-bright:light-dark(#ffc4bd,#ffbdb8); --wp-deep:light-dark(#a11e21,#d13830); }
#wattson-planet-draft[data-state="unavailable"] .wp-planet { animation:wp-breathe 2.4s ease-in-out infinite; }
#wattson-planet-draft[data-state="fallback"] .wp-halo { animation:wp-glow 3.6s ease-in-out infinite; }
#wattson-planet-draft[data-state="calculating"] .wp-halo { animation:wp-glow 1.8s ease-in-out infinite; }
#wattson-planet-draft[data-state="unavailable"] .wp-halo { animation:wp-glow 2.4s ease-in-out infinite; }
@keyframes wp-breathe { 0%,100% { opacity:1; } 50% { opacity:.48; } }
@keyframes wp-glow { 0%,100% { opacity:var(--wp-glow); } 50% { opacity:calc(var(--wp-glow) * .48); } }
@media(max-width:620px) { #wattson-planet-draft .wp-stage { flex-direction:column; gap:18px; min-height:430px; padding:22px 8px; } #wattson-planet-draft .wp-detail { width:100%; } #wattson-planet-draft .wp-enlarged { height:100px; } #wattson-planet-draft .wp-runtime { padding:0 0; gap:8px; } #wattson-planet-draft .wp-window { padding:12px; } #wattson-planet-draft .wp-top { padding-right:80px; } }
@media(prefers-reduced-motion:reduce) { #wattson-planet-draft .wp-planet,#wattson-planet-draft .wp-halo { animation:none !important; } }
</style>
<div id="wattson-planet-draft" data-state="calculating" aria-label="Wattson 星球状态灯设计稿">
  <div class="wp-top"><span>星球状态灯 · 动态设计稿</span><div class="wp-themes" aria-label="预览主题"><button type="button" data-theme="auto" aria-pressed="true">跟随</button><button type="button" data-theme="light" aria-pressed="false">浅色</button><button type="button" data-theme="dark" aria-pressed="false">深色</button></div></div>
  <div class="wp-states" aria-label="预览状态"><button type="button" data-state="system" aria-pressed="false">系统数据</button><button type="button" data-state="fallback" aria-pressed="false">后备估算</button><button type="button" data-state="calculating" aria-pressed="true">计算中</button><button type="button" data-state="unavailable" aria-pressed="false">无法计算</button></div>
  <div class="viz-carousel viz-dotted-background" aria-label="光点位置方案" data-previous-label="上一个方案" data-next-label="下一个方案">
    <section data-variant="文字旁" aria-label="文字旁的星球标签">
      <div class="wp-stage"><div class="wp-context"><div class="wp-label">实际大小 · 时间栏目</div><div class="wp-window"><div class="wp-runtime"><div class="wp-clock"><i data-lucide="clock-3" aria-hidden="true"></i></div><div class="wp-copy"><div class="wp-caption"><span class="wp-badge" aria-hidden="true"><span class="wp-halo"></span><span class="wp-planet"></span></span><span>Estimated Battery Runtime</span></div><div class="wp-value">Calculating…</div></div></div></div></div><div class="wp-detail"><div class="wp-label">细节放大 ×4</div><div class="wp-enlarged"><span class="wp-badge" aria-hidden="true"><span class="wp-halo"></span><span class="wp-planet"></span></span></div></div></div>
    </section>
    <section data-variant="时钟角标" aria-label="时钟角标的星球标签" hidden>
      <div class="wp-stage"><div class="wp-context"><div class="wp-label">实际大小 · 时间栏目</div><div class="wp-window wp-corner"><div class="wp-runtime"><div class="wp-clock"><i data-lucide="clock-3" aria-hidden="true"></i><span class="wp-badge" aria-hidden="true"><span class="wp-halo"></span><span class="wp-planet"></span></span></div><div class="wp-copy"><div class="wp-caption"><span>Estimated Battery Runtime</span></div><div class="wp-value">Calculating…</div></div></div></div></div><div class="wp-detail"><div class="wp-label">细节放大 ×4</div><div class="wp-enlarged"><span class="wp-badge" aria-hidden="true"><span class="wp-halo"></span><span class="wp-planet"></span></span></div></div></div>
    </section>
  </div>
  <div class="wp-statusline" aria-live="polite">计算中 · 稍快呼吸，等待 2 秒后星点斜绕一圈</div>
</div>
<script>
(() => {
  const root = document.getElementById('wattson-planet-draft');
  const states = { system:['4h 25m','系统数据 · 主题色恒亮'], fallback:['≈4h 25m','后备估算 · 缓慢、连续的呼吸光'], calculating:['Calculating…','计算中 · 稍快呼吸，等待 2 秒后星点斜绕一圈'], unavailable:['Unavailable','无法计算 · 柔和红色脉动'] };
  const ui = { state:'calculating', theme:'auto', glow:1 };
  let origin=performance.now();
  const particles=[];
  root.querySelectorAll('.wp-badge').forEach(badge=>{
    for(let i=0;i<8;i++) { const node=document.createElement('span'); node.className='wp-particle'; const size=i===0?1.9:Math.max(.45,1.5-i*.15); node.style.width=size+'px'; node.style.height=size+'px'; node.style.margin=(-size/2)+'px'; badge.appendChild(node); particles.push({node,i}); }
  });
  function render(){
    root.dataset.state=ui.state;
    root.style.colorScheme=ui.theme==='auto'?'':ui.theme;
    root.style.setProperty('--wp-glow',ui.glow);
    root.querySelectorAll('[data-state]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.state===ui.state)));
    root.querySelectorAll('[data-theme]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.theme===ui.theme)));
    root.querySelectorAll('.wp-value').forEach(value=>value.textContent=states[ui.state][0]);
    root.querySelector('.wp-statusline').textContent=states[ui.state][1];
  }
  function restore(saved){ const s=saved?.privateContent; if(states[s?.state])ui.state=s.state; if(['auto','light','dark'].includes(s?.theme))ui.theme=s.theme; render(); }
  function save(){ if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{previewState:ui.state,theme:ui.theme},privateContent:{state:ui.state,theme:ui.theme}}).catch(()=>{}); }
  root.querySelectorAll('button[data-state]').forEach(button=>button.addEventListener('click',()=>{ui.state=button.dataset.state;origin=performance.now();render();save();}));
  root.querySelectorAll('button[data-theme]').forEach(button=>button.addEventListener('click',()=>{ui.theme=button.dataset.theme;render();save();}));
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState);});
  const reduced=matchMedia('(prefers-reduced-motion:reduce)');
  function frame(now){
    const t=((now-origin)/1000)%8;
    const visible=ui.state==='calculating'&&!reduced.matches&&!document.hidden&&t>=2&&t<4.8;
    const fade=visible?Math.min(1,(t-2)/.2,(4.8-t)/.25):0;
    particles.forEach(({node,i})=>{
      node.style.opacity=String(fade*(i===0?1:.7*Math.pow(.72,i-1)));
      if(visible){const a=(t-2)/2.8*Math.PI*2-i*.13; const x=8.5*Math.cos(a),y=4.6*Math.sin(a),tilt=-Math.PI/5;node.style.transform=`translate(${x*Math.cos(tilt)-y*Math.sin(tilt)}px,${x*Math.sin(tilt)+y*Math.cos(tilt)}px)`;node.style.zIndex=Math.sin(a)>0?'2':'-1';}
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(ui,'glow',{label:'微光强度',min:.3,max:1.6,step:.1});}
})();
</script>
