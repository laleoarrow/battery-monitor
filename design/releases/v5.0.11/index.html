<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wattson 5.0.11 设计图集</title>
<style>
  :root { color-scheme: light dark; font: 16px/1.55 system-ui, sans-serif; }
  body { max-width: 72rem; margin: 2rem auto; padding: 0 1rem; }
  section { margin-block: 2rem; }
  .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 1rem; }
  figure { margin: 0; }
  img { display: block; width: 100%; height: auto; border-radius: .75rem; }
  figcaption { margin-block: .4rem; }
</style>
<main>
  <h1>Wattson 5.0.11 设计图集</h1>
  <p>Energy Flow 离屏设计预览。图中使用示例读数。</p>
  <section>
    <h2>充电与 USB 输出</h2>
    <div class="pair">
      <figure><img src="previews/charging-light.png" width="656" height="448" alt="浅色三路功率流"><figcaption>浅色</figcaption></figure>
      <figure><img src="previews/charging-dark.png" width="656" height="448" alt="深色三路功率流"><figcaption>深色</figcaption></figure>
    </div>
  </section>
  <section>
    <h2>适配器与电池共同供电</h2>
    <div class="pair">
      <figure><img src="previews/mixed-light.png" width="656" height="448" alt="浅色混合供电功率流"><figcaption>浅色</figcaption></figure>
      <figure><img src="previews/mixed-dark.png" width="656" height="448" alt="深色混合供电功率流"><figcaption>深色</figcaption></figure>
    </div>
  </section>
  <p><a href="../v5.0.3/">图标状态预览与可编辑 SVG</a> · <a href="https://github.com/laleoarrow/battery-monitor/releases/tag/v5.0.11">5.0.11 发行说明</a></p>
</main>
</html>
